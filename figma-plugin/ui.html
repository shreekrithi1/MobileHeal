<!doctype html>
<style>
  body { font: 12px/1.45 Inter, system-ui, sans-serif; margin: 12px; color: #1d2939; }
  h2 { font-size: 13px; margin: 0 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d0d5dd; border-radius: 6px; }
  button { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #175cd3; color: #fff; font-weight: 600; cursor: pointer; }
  button.secondary { background: #f2f4f7; color: #1d2939; }
  #log { margin-top: 10px; white-space: pre-wrap; color: #475467; }
  .err { color: #b42318; }
</style>
<h2>MobileHeal Design Sync</h2>
<label for="url">MobileHeal server</label>
<input id="url" value="http://localhost:8000">
<button id="apply">Apply approved design</button>
<button id="vars" class="secondary">Update variables only</button>
<div id="log">Pulls the rules approved in MobileHeal and applies them to the “MobileHeal” variables and to the selected frame (or every frame named “Profile”).</div>
<script>
  const log = (t, err) => { const l = document.getElementById("log"); l.textContent = t; l.className = err ? "err" : ""; };
  async function pull(onlyVars) {
    const base = document.getElementById("url").value.replace(/\/$/, "");
    try {
      const r = await fetch(base + "/api/figma/tokens");
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      parent.postMessage({ pluginMessage: { type: "apply", data, onlyVars } }, "*");
      log("Applying " + data.variables.length + " tokens…");
    } catch (e) { log("Couldn't reach MobileHeal at " + base + " — is it running? (" + e.message + ")", true); }
  }
  document.getElementById("apply").onclick = () => pull(false);
  document.getElementById("vars").onclick = () => pull(true);
  onmessage = (e) => { const m = e.data.pluginMessage; if (m) log(m.text, m.error); };
</script>
