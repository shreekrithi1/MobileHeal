# XcodeGen spec — generate the Xcode project with:  cd ios && xcodegen
# (./start.command --ios does this for you and opens Xcode)
name: MobileHeal
options:
  bundleIdPrefix: com.mobileheal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MobileHealKit:
    path: MobileHealKit
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MobileHeal:
    type: application
    platform: iOS
    sources: [MobileHeal]
    dependencies:
      - package: MobileHealKit
    info:
      path: MobileHeal/Info.plist
      properties:
        CFBundleDisplayName: MobileHeal
        UILaunchScreen: {}
        MHBaseURL: http://localhost:8000
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobileheal.app
        GENERATE_INFOPLIST_FILE: NO
  MobileHealTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MobileHealTests]
    dependencies:
      - target: MobileHeal
      - package: MobileHealKit
schemes:
  MobileHeal:
    build:
      targets:
        MobileHeal: all
        MobileHealTests: [test]
    test:
      targets: [MobileHealTests]
