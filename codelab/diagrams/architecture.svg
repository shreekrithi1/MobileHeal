<svg class="dg" data-cycle="12.0" viewBox="0 0 960 600" role="img" aria-labelledby="architecture-t architecture-d" xmlns="http://www.w3.org/2000/svg"><title id="architecture-t">MobileHeal architecture</title><desc id="architecture-d">A business user works in the web portal; the portal and the Android and iOS apps call the FastAPI backend. Inside it, Delivery workflow, Crash healer, DataWatchdog and the Agent council share one workspace. Changes land in an isolated Git workspace and state in a SQLite database. GitHub, Jira, Figma and Crashlytics are optional integrations, simulated in demo mode.</desc><style>text{font-family:"Google Sans",Roboto,Arial,sans-serif}.t{font-size:15px;font-weight:500;fill:#202124}.h{font-size:17px;font-weight:500;fill:#202124}.s{font-size:12px;fill:#5f6368}.s2{font-size:13px;fill:#3c4043}.o{font-size:11px;font-weight:500;fill:#3c4043}.num{font-size:14px;font-weight:700}.lbl{font-size:11.5px;fill:#5f6368;font-style:italic}.gate{font-size:11px;font-weight:500;fill:#b06000}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa0a6"/></marker></defs><rect x="150" y="186" width="580" height="236" rx="20" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/><text x="174" y="218" class="h">FastAPI backend</text><text x="320" y="218" class="s">localhost:8000 · a crew that keeps apps healthy</text>
