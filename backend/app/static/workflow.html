<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MobileHeal Delivery</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --sunk:#f0f2f5; --fg:#151a21; --muted:#5f6b7a; --faint:#8a95a3; --line:#e2e6eb;
  --accent:#0a6cff; --accent-fg:#fff; --accent-soft:#e8f1ff;
  --rail:rgba(246,247,249,.86); --rail-hover:rgba(0,0,0,.05); --rail-on:rgba(10,108,255,.12);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --ease:cubic-bezier(.2,.8,.2,1);
  --green:#14804a; --green-soft:#e7f6ee; --amber:#b25e09; --amber-soft:#fff4e2; --red:#c4320a; --red-soft:#fdecea;
  --blue:#175cd3; --blue-soft:#eaf2ff; --purple:#6941c6; --purple-soft:#f2edff;
  --add:#e6f6ec; --add-strong:#c5ecd3; --del:#fdeceb; --del-strong:#f8d0cd;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1014; --panel:#151a20; --sunk:#10151a; --fg:#e8ecf1; --muted:#9aa5b3; --faint:#6e7987; --line:#262d36;
  --accent:#3b8cff; --accent-fg:#fff; --accent-soft:#132a4d;
  --rail:rgba(20,24,30,.86); --rail-hover:rgba(255,255,255,.06); --rail-on:rgba(59,140,255,.18);
  --green:#4ade80; --green-soft:#12291c; --amber:#fbbf24; --amber-soft:#2d2210; --red:#f87171; --red-soft:#331616;
  --blue:#7cb1ff; --blue-soft:#13233d; --purple:#b69cff; --purple-soft:#241a3d;
  --add:#11291b; --add-strong:#1b4a2e; --del:#331617; --del-strong:#5a2224; --shadow:none;
}}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app shell: sidebar + content ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.rail{background:var(--rail);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px;overflow:auto;z-index:20}
.rail-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 12px}
.rail-brand b{display:block;font-size:15px;letter-spacing:-.01em}.rail-brand small{color:var(--muted);font-size:11.5px}
.rail-search{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;color:var(--muted);cursor:pointer;margin-bottom:10px;font-size:13px}
.rail-search kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--faint)}
.rail-label{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 4px}
.rail a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:13.5px;font-weight:500;min-height:34px;transition:background .15s var(--ease)}
.rail a svg{width:18px;height:18px;flex:none;color:var(--muted)}
.rail a:hover{background:var(--rail-hover)} .rail a.on{background:var(--rail-on);color:var(--accent)} .rail a.on svg{color:var(--accent)}
.rail .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;line-height:18px}
.rail .badge.amber{background:#f79009}.rail .badge:empty{display:none}
.rail-foot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:12px;color:var(--muted)}
.rail-foot div{display:flex;align-items:center;gap:7px}.dot8{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}.dot8.ok{background:#12b76a}.dot8.warn{background:#f79009}.dot8.err{background:var(--red)}
.content{display:flex;flex-direction:column;min-width:0;height:100%}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.crumbs b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis}.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--fg)}
.rail-toggle{display:none;border:0;background:none;font-size:20px;padding:4px 6px;cursor:pointer;color:var(--fg)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#5ac8fa,#0a6cff);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;cursor:pointer;text-decoration:none}
@media (max-width:980px){.shell{grid-template-columns:1fr}.rail{position:fixed;inset:0 auto 0 0;width:270px;transform:translateX(-102%);transition:transform .25s var(--ease);box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .shell.rail-open .rail{transform:none}.rail-toggle{display:inline-block}}

/* ---------- command palette ---------- */
.pal-bg{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.pal{width:min(620px,calc(100vw - 32px));background:var(--panel);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.3);overflow:hidden;border:1px solid var(--line)}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:17px;background:transparent;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}.pal li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:14px}
.pal li small{margin-left:auto;color:var(--faint);font-size:12px}.pal li.on{background:var(--accent);color:#fff}.pal li.on small{color:rgba(255,255,255,.8)}
.pal .grp{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px 2px}

/* ---------- home ---------- */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 22px}
.hero h1{font-size:30px;line-height:1.15;letter-spacing:-.022em;margin:0 0 6px;font-weight:700}.hero p{margin:0;color:var(--muted);font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .15s var(--ease),box-shadow .15s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(16,24,40,.08)}
.kpi .l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:4px}.kpi .s{font-size:12px;color:var(--faint)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px} @media (max-width:1100px){.home-grid{grid-template-columns:1fr}}
.att{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}.att:first-child{border-top:0}
.att .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:16px}
.att .tx{min-width:0;flex:1}.att .tx b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.att .tx span{font-size:12.5px;color:var(--muted)}
.ic-red{background:var(--red-soft);color:var(--red)}.ic-amber{background:var(--amber-soft);color:var(--amber)}.ic-blue{background:var(--blue-soft);color:var(--blue)}.ic-green{background:var(--green-soft);color:var(--green)}.ic-purple{background:var(--purple-soft);color:var(--purple)}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.flow a{background:var(--sunk);border-radius:10px;padding:12px;text-decoration:none;color:inherit;position:relative}
.flow a b{font-size:22px;display:block;letter-spacing:-.02em}.flow a span{font-size:12px;color:var(--muted)}
@media (max-width:700px){.flow{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:24px}}
.sysrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}.sysrow:first-child{border-top:0}.sysrow .st{margin-left:auto;color:var(--muted);font-size:12.5px;text-align:right}
.act-row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.act-row:first-child{border-top:0}.act-row time{color:var(--faint);font-size:12px;white-space:nowrap;margin-left:auto}
.index-empty{max-width:560px;margin:8vh auto;text-align:center}.index-empty .big{font-size:44px}.index-empty h2{font-size:22px;letter-spacing:-.015em;margin:8px 0}.index-empty p{color:var(--muted)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}

/* top bar */
.top{height:52px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em}
.logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#22c55e);display:grid;place-items:center;color:#fff;font-size:13px}
.nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:7px;font-weight:500}
.nav a.on{color:var(--fg);background:var(--sunk)}
.repo{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;background:var(--panel);white-space:nowrap}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--green)}

/* layout */
.app{display:grid;grid-template-columns:300px 1fr;flex:1;min-height:0}
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-h{padding:14px;border-bottom:1px solid var(--line)}
.list{overflow:auto;flex:1;padding:6px}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 10px;border-radius:9px;cursor:pointer;margin-bottom:2px}
.item:hover{background:var(--sunk)} .item.on{background:var(--accent-soft)}
.item .t{font-weight:600;font-size:13.5px;line-height:1.35;margin:3px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{display:flex;gap:8px;align-items:center;color:var(--faint);font-size:12px}
.main{overflow:auto;min-width:0}
.wrap{max-width:1120px;margin:0 auto;padding:22px 24px 60px}
.empty{color:var(--faint);text-align:center;padding:40px 10px;font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 14px;min-height:34px;transition:background .15s var(--ease),filter .15s;cursor:pointer;font-weight:550;white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{background:var(--sunk)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)} .btn.primary:hover{filter:brightness(1.08)}
.btn.green{background:#1a7f37;border-color:#1a7f37;color:#fff} .btn.green:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)} .btn.block{width:100%} .btn.sm{padding:4px 10px;font-size:12.5px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.s-design_review{background:var(--purple-soft);color:var(--purple)} .s-coding{background:var(--blue-soft);color:var(--blue)}
.s-pr_open{background:var(--green-soft);color:var(--green)} .s-merged{background:var(--purple-soft);color:var(--purple)}
.s-closed{background:var(--sunk);color:var(--muted)} .s-stopped{background:var(--amber-soft);color:var(--amber)} .s-reverted{background:var(--sunk);color:var(--muted)} .s-failed{background:var(--red-soft);color:var(--red)}
.s-tested{background:var(--green-soft);color:var(--green)}

/* header */
.hdr{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.hdr h1{font-size:22px;letter-spacing:-.015em;margin:0 0 6px;line-height:1.25}
.hdr .key{color:var(--faint);font-weight:500}
.meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.branch{font-family:var(--mono);font-size:12px;background:var(--blue-soft);color:var(--blue);padding:1px 7px;border-radius:5px}

/* stepper */
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin:20px 0 4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 10px;box-shadow:var(--shadow)}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:12.5px;color:var(--faint);font-weight:550;text-align:center}
.step:not(:last-child)::after{content:"";position:absolute;top:13px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:var(--line)}
.step.done:not(:last-child)::after{background:var(--green)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--panel);font-size:12px;z-index:1}
.step.done{color:var(--fg)} .step.done .n{background:var(--green);border-color:var(--green);color:#fff}
.step.cur{color:var(--accent)} .step.cur .n{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.step.cur.spin .n{border-top-color:transparent;animation:spin 1s linear infinite}
.step.err .n{border-color:var(--red);color:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.count{background:var(--sunk);border-radius:99px;padding:0 7px;font-size:11.5px;color:var(--muted)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-b{padding:16px}
.grid{display:grid;gap:16px} .grid>*{min-width:0} .g2{grid-template-columns:1fr 1fr} .g-side{grid-template-columns:1fr 330px}
@media (max-width:980px){.g2,.g-side{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{display:none}.app.list-open .side{display:flex}}
.label{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.field{margin-bottom:14px} .field label{display:block;font-weight:600;margin-bottom:5px}
.input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 11px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.code{font-family:var(--mono);font-size:13px;line-height:1.6;min-height:240px;resize:vertical;background:var(--sunk)}
textarea.code.bad{border-color:var(--red)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px} .err{color:var(--red)} .ok{color:var(--green)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.quick input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel);cursor:pointer}

/* phone */
.phones{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.pcol{display:flex;flex-direction:column;align-items:center;gap:10px}
.pcap{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.phone{width:262px;height:520px;border-radius:38px;padding:11px;background:#0b0d10;box-shadow:0 18px 40px -18px rgba(0,0,0,.45),inset 0 0 0 2px #2a2f36}
.screen{width:100%;height:100%;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;color:#1b1f24;position:relative}
.sb{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:11px;font-weight:600}
.appbar{padding:8px 16px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:650;font-size:16px}
.live{font-size:10.5px;font-weight:600;color:#12b76a}
.pbody{padding:6px 14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:9px}
.banner{border-radius:10px;padding:9px 11px;font-size:11.5px;line-height:1.4}
.banner b{display:block;font-size:12px;margin-bottom:2px}
.ptitle{font-weight:650;font-size:14px;margin-top:2px}
.pf{position:relative;border:1px solid #9aa3ad;border-radius:6px;padding:12px 10px 6px;font-size:12.5px;background:transparent;min-height:38px}
.pf span{position:absolute;top:-8px;left:8px;padding:0 4px;font-size:10px;color:#5f6b7a;background:inherit}
.pf input{border:0;outline:0;width:100%;background:transparent;font-size:12.5px;color:#1b1f24;padding:0}
.pf.miss{border-color:#d92d20;border-width:2px} .pf.miss span{color:#d92d20}
.pf.new{box-shadow:0 0 0 3px rgba(79,70,229,.25)}
.pbtn{border:0;border-radius:20px;padding:10px;font-weight:650;font-size:13px;cursor:pointer;margin-top:4px}
.ptoast{position:absolute;left:14px;right:14px;bottom:14px;background:#1b1f24;color:#fff;font-size:11.5px;border-radius:8px;padding:8px 10px;opacity:0;transform:translateY(8px);transition:.25s}
.ptoast.show{opacity:1;transform:none}
/* platform tabs (top bar) */
.plat{display:inline-flex;background:var(--sunk);border-radius:9px;padding:2px;gap:2px}
.plat button{border:0;background:none;border-radius:7px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.plat button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* iOS look for phone previews */
.plat-ios .phone{border-radius:46px;background:#1c1c1e;box-shadow:0 18px 40px -18px rgba(0,0,0,.45),inset 0 0 0 2px #3a3a3c}
.plat-ios .screen{border-radius:36px;background:#f2f2f7!important;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
.plat-ios .sb{position:relative;padding:0 22px}.plat-ios .sb::after{content:"";position:absolute;left:50%;top:5px;transform:translateX(-50%);width:76px;height:20px;border-radius:12px;background:#000}
.plat-ios .appbar{flex-direction:column;align-items:flex-start;gap:0;font-size:24px;font-weight:800;letter-spacing:-.02em;padding:14px 16px 6px}
.plat-ios .appbar .live{font-size:10px;font-weight:600;order:-1}
.plat-ios .pbody{gap:0;padding:4px 14px 10px}
.plat-ios .ptitle{text-transform:uppercase;font-size:10.5px;font-weight:500;color:#6d6d72;margin:10px 4px 5px}
.plat-ios .pf{background:#fff!important;border:0;border-radius:0;border-bottom:.5px solid #d1d1d6;padding:16px 12px 6px}
.plat-ios .ptitle + .pf{border-radius:10px 10px 0 0}.plat-ios .pf:has(+ .pbtn){border-radius:0 0 10px 10px;border-bottom:0}
.plat-ios .pf span{top:4px;left:12px;background:none;font-size:9.5px;color:#8e8e93}
.plat-ios .pf.miss{box-shadow:inset 3px 0 0 #ff3b30}.plat-ios .pf.miss span{color:#ff3b30}
.plat-ios .pbtn{border-radius:12px;padding:12px;margin-top:18px;font-size:14px}
.plat-ios .banner{border-radius:10px;margin-bottom:6px}
.plat-ios .screen::after{content:"Profile          Alerts          About";position:absolute;left:0;right:0;bottom:0;height:40px;background:rgba(249,249,249,.94);border-top:.5px solid #c6c6c8;font-size:9.5px;color:#8e8e93;display:flex;align-items:center;justify-content:center;white-space:pre}

.snav{position:sticky;top:12px;display:grid;gap:2px}
.snav a{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:9px;color:var(--fg);text-decoration:none;font-size:13.5px;font-weight:500}
.snav a span{width:18px;text-align:center;color:var(--muted)} .snav a:hover{background:var(--sunk)} .snav a.on{background:var(--rail-on);color:var(--accent)} .snav a.on span{color:var(--accent)}
.spane h2{font-size:22px;letter-spacing:-.015em;margin:2px 0 4px}.sdesc{color:var(--muted);margin:0 0 18px;max-width:720px}
.sgroup{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;box-shadow:var(--shadow);overflow:hidden}
.sgroup-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 18px;font-weight:650;border-bottom:1px solid var(--line)}
.sgroup-h > span:first-child{display:flex;align-items:center;gap:9px}
.sgroup-b{padding:14px 18px}.sgroup-b:empty{display:none}
.sgroup-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:var(--sunk);border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;padding:14px 18px;border-top:1px solid var(--line);align-items:center}
.sgroup-h + .srow{border-top:0}
.srow-t{font-weight:550;font-size:13.5px}.srow-h{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.45}
.srow-c{display:flex;justify-content:flex-end}.srow-c > .input,.srow-c > select,.srow-c .secret{width:100%}
.secret{display:flex;gap:8px;align-items:center}.secret .chip{flex:none}
.brand-ic{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;color:#fff;font-size:10.5px;font-weight:800}
.brand-ic.gh{background:#24292f}.brand-ic.gl{background:#fc6d26}.brand-ic.jr{background:#0052cc}.brand-ic.cf{background:#1868db}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:22px}
.ctile{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;transition:box-shadow .15s}
.ctile:hover{box-shadow:0 4px 14px rgba(16,24,40,.08)}.ctile b{display:block;font-size:13.5px}.ctile span{font-size:12px;color:var(--muted)}.ctile .chev{margin-left:auto;font-size:18px;color:var(--faint)}
.savebar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:18px;align-items:center;background:var(--fg);color:var(--bg);padding:10px 12px 10px 18px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);z-index:40;font-weight:550}
.savebar[hidden]{display:none}
.savebar .btn{color:var(--fg)} .savebar .btn.primary{color:#fff}
@media (max-width:900px){.settings{grid-template-columns:1fr}.snav{position:static;grid-auto-flow:column;overflow-x:auto}.srow{grid-template-columns:1fr}.srow-c{justify-content:flex-start}}

/* ---- Crashlytics (live) ---- */
.cx-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 18px}
.cx-kpi{padding:14px 16px}.cx-kpi small{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cx-kpi b{display:block;font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.cx-kpi .sub{color:var(--faint);font-size:12px}
.cx-live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--red)}
.cx-live i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:cxpulse 1.4s infinite}
@keyframes cxpulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}70%{box-shadow:0 0 0 8px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
.cx-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.cx-list{display:grid;gap:10px}
.cx-row{padding:0;overflow:hidden;transition:border-color .3s}
.cx-row.flash{border-color:var(--red)}
.cx-head{display:grid;grid-template-columns:34px minmax(0,1fr) 130px 92px 92px 150px 128px;gap:12px;align-items:center;padding:12px 16px;cursor:pointer}
.cx-head:hover{background:var(--sunk)}
.cx-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--red-soft);color:var(--red)}
.cx-row.resolved .cx-ic{background:var(--green-soft);color:var(--green)} .cx-row.healing .cx-ic{background:var(--blue-soft);color:var(--blue)}
.cx-t b{display:block;font-family:var(--mono);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-t span{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-num{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}.cx-num small{display:block;color:var(--faint);font-weight:500;font-size:11px}
.cx-num.bump{animation:cxbump .6s var(--ease)}
@keyframes cxbump{0%{color:var(--red);transform:scale(1.12)}100%{transform:none}}
.cx-spark{width:130px;height:30px}
.cx-st{display:flex;flex-direction:column;gap:3px;align-items:flex-start}.cx-st small{color:var(--faint);font-size:11.5px}
.cx-st .chip.open{background:var(--red-soft);color:var(--red)} .cx-st .chip.healing{background:var(--blue-soft);color:var(--blue)}
.cx-st .chip.resolved{background:var(--green-soft);color:var(--green)} .cx-st .chip.attention{background:var(--amber-soft);color:var(--amber)}
.cx-prog{height:3px;width:100%;background:var(--sunk);border-radius:2px;overflow:hidden}.cx-prog i{display:block;height:100%;background:var(--blue);transition:width .6s var(--ease)}
.cx-body{border-top:1px solid var(--line);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;background:var(--sunk)}
.cx-body h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.cx-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cx-tl{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.cx-tl li{display:grid;grid-template-columns:62px 1fr;gap:8px}.cx-tl time{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px}
@media (max-width:1100px){.cx-head{grid-template-columns:34px minmax(0,1fr) 90px 128px}.cx-head .cx-spark,.cx-head .cx-hide{display:none}.cx-body{grid-template-columns:1fr}.cx-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---- App Studio ---- */
.nm-toggle{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin:0 0 16px}
.nm-toggle button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:650;color:var(--muted);cursor:pointer}
.nm-toggle button.on{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.st-team{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:16px 0}
.st-agent{padding:12px;position:relative;transition:transform .2s,border-color .2s}
.st-agent .av{font-size:22px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);margin-bottom:8px}
.st-agent b{display:block;font-size:13px}.st-agent small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35;margin-top:2px;min-height:30px}
.st-agent .s{margin-top:8px;font-size:11.5px;font-weight:650;display:flex;gap:6px;align-items:center}
.st-agent.working{border-color:var(--accent);transform:translateY(-2px)} .st-agent.working .av{background:var(--accent-soft)}
.st-agent.done .av{background:var(--green-soft)} .st-agent.attention .av{background:var(--amber-soft)}
.st-agent.em{background:linear-gradient(180deg,var(--accent-soft),var(--panel))}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}.dot.working{background:var(--accent);animation:cxpulse 1.2s infinite}
.dot.done{background:var(--green)}.dot.waiting{background:var(--amber)}.dot.attention{background:var(--red)}
.st-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}
.st-feed{max-height:620px;overflow:auto;padding:6px 14px}
.st-msg{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.st-msg:last-child{border:0}
.st-msg .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sunk)}
.st-msg .who{font-size:12.5px;font-weight:700}.st-msg .who span{color:var(--faint);font-weight:500;margin-left:6px}
.st-msg p{margin:2px 0 0;font-size:13.5px}.st-msg.gate p{color:var(--green)}.st-msg.block p,.st-msg.error p{color:var(--red)}
.st-msg.merged{background:var(--green-soft);border-radius:10px;padding:10px}
.st-msg.power p{color:var(--purple)} .st-pw{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.st-pw span{font-size:10.5px;font-weight:650;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.st-pw span.used{background:var(--purple-soft);color:var(--purple)}
.st-score{font-size:44px;font-weight:800;line-height:1}
.st-phone{width:300px;height:600px;border:10px solid #111;border-radius:36px;overflow:hidden;margin:0 auto;background:#fff}
.st-phone iframe{width:100%;height:100%;border:0}
.st-tbl{width:100%;border-collapse:collapse;font-size:13px}.st-tbl td,.st-tbl th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
@media (max-width:1100px){.st-team{grid-template-columns:repeat(2,minmax(0,1fr))}.st-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell" id="shell">
<nav class="rail" id="rail" aria-label="Primary">
  <div class="rail-brand"><div class="logo" aria-hidden="true">✚</div><div><b>MobileHeal</b><small>Autonomous app delivery</small></div></div>
  <button class="rail-search" onclick="openPalette()" aria-label="Search and commands"><span style="width:15px;display:inline-flex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>Search<kbd>⌘K</kbd></button>
  <a href="#home" data-r="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <div class="rail-label">Deliver</div>
  <a href="#delivery" data-r="delivery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12h6M9 16h4"/></svg>Requirements<span class="badge amber" id="b-req"></span></a>
  <a href="#studio" data-r="studio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.6 7.1 18.2l.9-5.5-4-3.9 5.5-.8z"/></svg>App Studio</a>
  <a href="#tests" data-r="tests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7 15h10"/></svg>Test library</a>
  <div class="rail-label">Operate</div>
  <a href="#incidents" data-r="incidents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/></svg>Incidents<span class="badge" id="b-inc"></span></a>
  <a href="#data" data-r="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v13c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-13M4.5 12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5"/></svg>Data health<span class="badge" id="b-data"></span></a>
  <a href="/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Live monitor</a>
  <a href="#crashes" data-r="crashes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 1-5 2 1 3 3 3 3"/><path d="M6 14a6 6 0 0 0 12 0"/></svg>Crashlytics<span class="badge" id="b-cx"></span></a>
  <a href="#demo" data-r="demo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></svg>Crash demo</a>
  <div class="rail-label">Configure</div>
  <a href="#settings" data-r="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
  <a href="#audit" data-r="audit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>Audit log</a>
  <div class="rail-foot" id="rail-foot" aria-live="polite"></div>
</nav>
<div class="content">

  <button class="rail-toggle" aria-label="Open navigation" onclick="$('#shell').classList.toggle('rail-open')">☰</button>

  <div class="plat" role="tablist" aria-label="Platform" id="plat">
    <button role="tab" data-p="android" onclick="setPlatform('android')"><span aria-hidden="true">🤖</span>Android</button>
    <button role="tab" data-p="ios" onclick="setPlatform('ios')"><span aria-hidden="true">📱</span>iOS</button>
  </div>

  <div class="repo" id="repo"></div>

  <button class="bell" id="bell" aria-label="Notifications" onclick="toggleNotifs()">🔔</button>

</header>

    <div class="side-h"><button class="btn primary block" onclick="go('new')">＋ New change request</button></div>
    <div class="filters" role="tablist" aria-label="Filter"><button data-f="change" class="on">Changes</button><button data-f="incident">Incidents</button><button data-f="all">All</button></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SMALL = new Set(["of","and","the","or","to","in","on","for","a","an"]);
const label = k => k.split("_").filter(Boolean).map((w,i) => i && SMALL.has(w) ? w : w[0].toUpperCase() + w.slice(1)).join(" ");
const STATUS = {stopped:"Stopped", reverted:"Reverted", design_review:"Design review", coding:"Coding", pr_open:"PR open", merged:"Merged", closed:"Closed", failed:"Failed",
  detected:"Detected", diagnosing:"Analyzing", awaiting_approval:"Awaiting approval", fixing:"Auto-fixing", needs_engineer:"Needs engineer"};
const isInc = cr => cr && cr.kind === "incident";
const UI_DEF = {after_save:"stay", success_title:"Profile saved", success_message:"Thanks — your details are up to date.", app_title:"MobileHeal", button_label:"Save", button_color:"#6750A4", button_text_color:"#FFFFFF",
  banner_color:"#FFF4E5", banner_text_color:"#B54708", background_color:"#FFFFFF"};
let state = {platform:(()=>{ try { return localStorage.getItem("mh.platform")||"android"; } catch(e){ return "android"; } })(), filter:"change", healer:null, seen:null, list:[], info:null, cr:null, tab:null, route:null, poll:null, preview:{mode:"after", values:{}, profile:null}, testChecks:{}};

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
async function api(path, opts={}) {
  const r = await fetch(path, {headers:{"Content-Type":"application/json"}, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined});
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));
  return data;
}
function ago(ts){ const s=(Date.now()-new Date(ts))/1000; if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+"m ago"; if(s<86400) return Math.floor(s/3600)+"h ago"; return new Date(ts).toLocaleDateString(); }
function setPlatform(p){
  state.platform = p; try { localStorage.setItem("mh.platform", p); } catch(e){}
  document.body.classList.toggle("plat-ios", p === "ios");
  document.querySelectorAll("#plat button").forEach(b => { const on = b.dataset.p === p; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
  if (state.cr && state.route === "cr") renderCR(); else if (state.route === "settings") renderSettings("settings/"+(state.setSec||"general"));
}
const platOf = path => path.startsWith("ios/") ? "ios" : path.startsWith("android/") ? "android" : "shared";
function jiraLink(j){ return j.url ? `<a class="jira" href="${esc(j.url)}" target="_blank" rel="noopener" title="Open in Jira"><i></i>${esc(j.key)} · ${esc(j.status||"")}</a>`
  : `<a class="jira" href="javascript:void 0" onclick="showJira('${esc(j.key)}')" title="Mock Jira — configure Jira in Settings"><i></i>${esc(j.key)} · ${esc(j.status||"")}</a>`; }
async function showJira(key){
  try { const i = await api("/api/jira/issues/"+encodeURIComponent(key));
    modal(`<div class="card-h"><span class="jira"><i></i>${esc(i.key)}</span><span style="display:flex;gap:8px;align-items:center"><span class="chip s-design_review">${esc(i.status)}</span><span class="chip s-closed">Mock Jira</span><button class="btn sm" onclick="closeModal()">Close</button></span></div>
      <div class="card-b" style="max-height:72vh;overflow:auto;display:grid;gap:12px">
        <div><b style="font-size:16px">${esc(i.summary)}</b><div class="hint" style="margin:4px 0 0">${esc(i.type)} · priority ${esc(i.priority)} · ${i.labels.map(esc).join(", ")} · created ${esc(i.created.replace("T"," "))}</div></div>
        <pre class="trace" style="white-space:pre-wrap;max-height:240px;overflow:auto">${esc(i.description)}</pre>
        <div><div class="label">Workflow</div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${i.history.map((h,k)=>`${k?"<span class='hint' style='margin:0'>→</span>":""}<span class="chip s-closed" title="${esc(h.ts)}">${esc(h.to)}</span>`).join("")}</div></div>
        <div><div class="label">Comments (${i.comments.length})</div>${i.comments.map(c=>`<div style="border-left:3px solid #2684FF;padding:6px 10px;margin:6px 0;background:var(--sunk);border-radius:0 8px 8px 0"><div class="hint" style="margin:0 0 4px">${esc(c.author)} · ${esc(c.ts.replace("T"," "))}</div><div style="white-space:pre-wrap;font-size:13px">${esc(c.body)}</div></div>`).join("")}</div>
        <div class="hint" style="margin:0">Mock mode — add your Jira site, email and API token in Settings to file real defects.</div></div>`);
  } catch(e){ toast(e.message); }
}
async function approveFix(){ const note = ($("#ap-note")||{}).value||"";

  return `<svg class="cx-spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${line} L${w} ${h} L0 ${h} Z" fill="${col}" opacity=".12"/><path d="${line}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

        <span class="chip" style="background:var(--panel)">${esc(i.versions.join(", "))}</span><span class="chip" style="background:var(--panel)">${esc(i.os)}</span><code style="font-size:12px">${esc(i.file)}</code></div>

        <div class="hint" style="margin:0">Devices: ${esc(i.devices.join(" · "))}<br>First seen ${ago(i.first_seen)} · last event ${ago(i.last_seen)}${i.resolved_at?` · resolved ${ago(i.resolved_at)}`:""}</div>

/* ---------------- CR detail ---------------- */
function stageOf(cr){
  if (isInc(cr)) return ({detected:1, diagnosing:1, awaiting_approval:2, fixing:3, needs_engineer: cr.fix_approved?3:(cr.analysis?2:1), pr_open: cr.tested?6:5, merged:7, closed:cr.pr?5:1})[cr.status] ?? 1;
  return cr.status==="merged" ? 6 : cr.status==="coding" ? 2 : cr.status==="design_review" ? 1 :
  cr.status==="pr_open" ? (cr.tested ? 5 : 4) : cr.status==="failed" ? 2 : cr.stage||1; }
function stepper(cur, cr){
  const names = isInc(cr) ? ["Defect","Analyze","Approve","Auto-fix","Pull Request","Test","Merge"] : ["Requirements","UX Design","Coding","Pull Request","Test","Merge"];
  return `<div class="steps">${names.map((n,i)=>{
    let cls = i<cur ? "done" : i===cur ? "cur" : "";
    if (cr && ["coding","diagnosing","fixing"].includes(cr.status) && i===cur) cls += " spin";
    if (cr && ["failed","needs_engineer"].includes(cr.status) && i===cur) cls = "err";
    if (cr && cr.status==="closed") cls = i<cur ? "done" : "";
    return `<div class="step ${cls}"><div class="n">${i<cur?"✓":i+1}</div>${n}</div>`; }).join("")}</div>`;
}
const defaultTab = cr => isInc(cr) ? ({detected:"overview", diagnosing:"diagnosis", awaiting_approval:"diagnosis", fixing:"diagnosis", needs_engineer:"diagnosis", pr_open: cr.tested?"pr":"test", merged:"pr", closed:"overview"})[cr.status]||"overview" : ({design_review:"design", coding:"code", failed:"code", pr_open: cr.tested ? "pr" : "test", merged:"pr", closed:"overview"})[cr.status] || "overview";

async function loadCR(id, tab){
  clearInterval(state.poll);
  try { state.cr = await api(`/api/cr/${id}`); } catch(e){ $("#view").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }
  if (state.preview.crId !== id) {
    const profs = await api("/api/profiles");
    state.preview = {crId:id, mode:"after", profile: profs[0]||null, values: {...(profs[0]||{name:"Jane Doe",email:"jane@example.com"})}, profiles: profs};
    state.testChecks = {};
  }
  state.tab = tab || defaultTab(state.cr);
  if (!isInc(state.cr)) await loadTests(); else state.tests = null;
  renderCR();
  const alive = () => state.route === "cr" && state.cr && state.cr.id === id;
  if (["coding","diagnosing","fixing"].includes(state.cr.status)) state.poll = setInterval(async () => {
    if (!alive()) return clearInterval(state.poll);
    const cr = await api(`/api/cr/${id}`);
    if (!alive()) return;
    if (JSON.stringify(cr.coding_log) !== JSON.stringify(state.cr.coding_log) || cr.status !== state.cr.status) {
      const done = !["coding","diagnosing","fixing"].includes(cr.status); state.cr = cr;
      if (done) { clearInterval(state.poll); state.tab = defaultTab(cr); await refreshList(); await refreshInfo(); if (!isInc(cr)) await loadTests();
        if (cr.status === "pr_open" || cr.status === "awaiting_approval") setTimeout(() => alive() && loadCR(id, state.tab), 300);   // keep watching: reviewers / Autopilot act next
        toast(cr.status==="awaiting_approval" ? "Analysis ready — approve the automatic fix" : cr.status==="pr_open" ? (isInc(cr) ? `Fix PR #${cr.pr.number} is ready for your review` : `PR #${cr.pr.number} opened — try it in the Test tab`) : isInc(cr) ? "Couldn't auto-fix — needs an engineer" : "Coding failed"); }
      renderCR();
    }
  }, 700);
  else if (["pr_open","design_review","awaiting_approval","detected"].includes(state.cr.status)) state.poll = setInterval(async () => {
    if (!alive()) return clearInterval(state.poll);
    if ((state.mode||{}).mode !== "autopilot" && !(state.cr.review && state.cr.pr && state.cr.pr.github_number)) return;
    const cr = await api(`/api/cr/${id}`);
    if (!alive()) return;
    if (cr.status !== state.cr.status || cr.updated_at !== state.cr.updated_at) {
      const moved = cr.status !== state.cr.status; state.cr = cr;
      if (moved) { clearInterval(state.poll); await refreshList(); await refreshInfo(); return loadCR(id, cr.status==="merged" ? "pr" : undefined); }
      renderCR();
    }
  }, 1500);
}

/* code */
function diffTable(diff){
  let o=0,n=0; const rows=[];
  for (const line of diff.split("\n")) {
    if (line.startsWith("---")||line.startsWith("+++")||line==="") continue;
    if (line.startsWith("@@")) { const m=/@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(line); o=+m[1]; n=+m[2]; rows.push(`<tr class="h"><td colspan="3">${esc(line)}</td></tr>`); continue; }
    const c=line[0], body=esc(line.slice(1));
    if (c==="+") rows.push(`<tr class="a"><td class="ln"></td><td class="ln">${n++}</td><td>+${body}</td></tr>`);
    else if (c==="-") rows.push(`<tr class="r"><td class="ln">${o++}</td><td class="ln"></td><td>-${body}</td></tr>`);
    else rows.push(`<tr><td class="ln">${o++}</td><td class="ln">${n++}</td><td> ${body}</td></tr>`);
  }
  return `<div class="diffscroll"><table class="diff">${rows.join("")}</table></div>`;
}
function bar5(a,r){ const t=a+r||1, na=Math.round(5*a/t); return `<span class="bar5">${[0,1,2,3,4].map(i=>`<i class="${i<na?'a':i<5&&r?'r':''}"></i>`).join("")}</span>`; }
function codingLog(cr){
  const log = cr.coding_log||[];
  const steps = isInc(cr) ? ["Diagnose","Reproduce","Approval","Fix","Run checks","Open pull request"]
    : ["Generate code","Generate test cases","Android developer agent", ...[...new Set(log.map(e=>e.step).filter(x=>x.startsWith("Agent · ")))], ...(log.some(e=>e.step==="iOS developer agent")?["iOS developer agent"]:[]), "Run checks","Open pull request"];
  return `<div class="card" style="margin-bottom:16px"><div class="card-h">Build pipeline ${cr.status==="coding"?'<span class="chip s-coding">running</span>':""}</div>
    ${steps.map(s=>{ const ev=[...log].reverse().find(e=>e.step===s); let st=ev?ev.status:"pending"; if(st==="warn") st="warn";
      return `<div class="chk ${s.startsWith("Agent · ")?"sub":""}"><div class="dot d-${st==='pending'?'info':st}" style="${st==='pending'?'opacity:.35':''}">${st==='done'?'✓':st==='fail'?'✕':st==='warn'?'!':''}</div>
        <div><div class="nm">${s.replace("Agent · ","")}</div><div class="dt">${esc(ev&&ev.detail||(st==='pending'?'waiting':''))}</div></div></div>`; }).join("")}
    ${log.filter(e=>e.step==="Error").map(e=>`<div class="chk"><div class="dot d-fail">✕</div><div><div class="nm">Error</div><div class="dt">${esc(e.detail)}</div></div></div>`).join("")}</div>`;
}

/* PR */
function md(src){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/(^|\s)_([^_]+?)_(?=\s|$|[.,])/g,"$1<i>$2</i>");
  let html="", list=null;
  for (const l of src.split("\n")) {
    const m = /^(\d+\.|-) (.*)$/.exec(l);
    if (m) { const t = m[1]==="-"?"ul":"ol"; if (list!==t){ if(list) html+=`</${list}>`; html+=`<${t}>`; list=t; } html+=`<li>${inline(m[2])}</li>`; continue; }
    if (list){ html+=`</${list}>`; list=null; }
    if (l.startsWith("### ")) html+=`<h3>${inline(l.slice(4))}</h3>`; else if (l.startsWith("## ")) html+=`<h2>${inline(l.slice(3))}</h2>`; else if (l.trim()) html+=`<p>${inline(l)}</p>`;
  }
  return html + (list?`</${list}>`:"");
}
function tPR(cr){
  if (!cr.pr) return `<div class="empty">The pull request is opened automatically after coding.</div>`;
  const live = (state.info&&state.info.live_spec)||"";
  const upToDate = isInc(cr) ? true : live === cr.base_spec, checksOk = !(cr.checks_summary&&cr.checks_summary.fail);
  const reqs = [[checksOk, checksOk?"All checks have passed":"Some checks are failing", "checks"],
    isInc(cr) ? [cr.tested, cr.tested?"Approved by a reviewer":"Waiting for the fix to be approved (Approve fix tab)", "test"]
              : [cr.tested, cr.tested ? (cr.override ? `Test gate overridden by ${cr.override.by}: “${cr.override.reason}”` : `All ${state.tests?state.tests.gate.total:""} test cases passed`)
                              : `${state.tests?state.tests.gate.passed:0}/${state.tests?state.tests.gate.total:0} test cases passed`, "test"],
    [upToDate, upToDate?"Branch is up to date":"Code changed since this PR was created", null]];
  if (cr.review) { const r = cr.review, ok = r.status==="approved";
    reqs.splice(1, 0, [ok, (ok ? "Code review approved — " : r.status==="changes_requested" ? "Changes requested — " : "Waiting for reviewers — ")
      + Object.entries(r.per_platform||{}).map(([p,v])=>`${p==="android"?"Android":"iOS"} ${v.approvals}/${v.required}`).join(" · "), "review"]); }
  const can = cr.status==="pr_open" && reqs.every(r=>r[0]);
  const cmp = cr.pr.compare;
  return `<div class="grid g-side">
    <div class="card"><div class="card-h"><span>Description</span><button class="btn sm" onclick="navigator.clipboard.writeText(state.cr.pr_body);toast('Copied as Markdown')">Copy Markdown</button></div>
      <div class="card-b md">${md(cr.pr_body||"")}</div></div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="card-h">Pull request #${cr.pr.number}</div><div class="card-b" style="font-size:13px;display:grid;gap:8px">
        <div><span class="hint" style="margin:0">New branch → base</span><br><span class="branch">${esc(cr.pr.branch)}</span> → <span class="branch">${esc(cr.pr.base)}</span>
          ${cr.pr.type?`<div class="hint" style="margin:4px 0 0">${{hotfix:"Hotfix branch for a production incident",feature:"Feature branch for a new requirement",change:"Change branch for a change request"}[cr.pr.type]||""}, cut from <code>${esc(cr.pr.base)}</code>${cr.pr.base_commit?` at <code>${esc(cr.pr.base_commit)}</code>`:""}.</div>`:""}</div>
        ${cmp?`<div><span class="hint" style="margin:0">Compared with ${esc(cmp.base)}</span><br><b>${cmp.ahead}</b> commit${cmp.ahead===1?"":"s"} ahead · <b>${cmp.behind}</b> behind${cmp.behind?` <span class="chip s-diagnosing">${esc(cmp.base)} moved on</span>`:""}
          ${cmp.commits&&cmp.commits.length?`<div class="commits" style="margin-top:6px">${cmp.commits.map(c=>`<div><code>${esc(c.sha)}</code> ${esc(c.subject)}</div>`).join("")}</div>`:""}</div>`:""}
        ${cr.pr.commit?`<div><span class="hint" style="margin:0">Head commit</span><br><code>${esc(cr.pr.commit)}</code></div>`:""}
        <div><span class="hint" style="margin:0">Changes</span><br>${cr.stats.files} files · <span class="plus">+${cr.stats.additions}</span> <span class="minus">−${cr.stats.deletions}</span> · <a href="#cr/${cr.id}/code">view diff</a></div>
        ${cr.pr.github_url?`<div><a href="${esc(cr.pr.github_url)}" target="_blank" rel="noopener">Open on ${cr.pr.provider==="gitlab"?"GitLab":"GitHub"} ↗</a></div>`:""}
        ${cr.pr.git?"":`<div class="hint">git isn't available, so this PR exists only in MobileHeal${cr.pr.git_error?`: ${esc(cr.pr.git_error)}`:""}.</div>`}
        ${cr.pr.github_error?`<div class="hint err">GitHub: ${esc(cr.pr.github_error)}</div>`:""}
      </div></div>

/* ---------------- sync hub ---------------- */
function syncChip(cr){

}
const SYNC_ICON = {push:"→", pull:"←", "?":"·"};
function syncSteps(steps){ return steps.map(x=>`<div class="sync-step"><span aria-hidden="true">${x.ok?"✓":"✕"}</span><b>${esc(x.platform)}</b><span class="hint" style="margin:0">${SYNC_ICON[x.direction]||""} ${esc(x.direction)}</span><span class="d ${x.ok?"":"err"}">${esc(x.detail)}</span></div>`).join(""); }
async function syncCR(){

function renderRunner(){

  const done = r.results.filter(x=>["pass","fail","blocked"].includes(x.status)).length;
  const overall = r.results.some(x=>x.status==="fail") ? "failed" : r.results.some(x=>x.status==="blocked") ? "blocked" : done===c.steps.length ? "passed" : null;
  const fieldsInRules = profileFields(r.rules);
  modal(`<div class="modal-h"><span><span class="hint" style="margin:0">${esc(c.key)}</span> ${esc(c.title)} <span class="chip prio-${c.priority}">${esc(c.priority)}</span> ${srcChip(c)}</span>
      <span style="display:flex;gap:8px;align-items:center">${r.queue.length?`<span class="hint" style="margin:0">${r.queue.length} more queued</span>`:""}<button class="btn sm" onclick="rnClose()">Close</button></span></div>

        ${c.steps.map((s,i)=>{ const res=r.results[i], cur=i===r.idx&&!overall;
          return `<div class="rstep ${cur?'cur':''} st-${res.status}"><div class="rdot">${{pass:"✓",fail:"✕",blocked:"!",running:"",pending:i+1}[res.status]??i+1}</div>
          <div style="min-width:0;flex:1"><div class="ra">${s.auto?'<span title="automated">🤖</span>':'<span title="manual">👤</span>'} ${esc(s.action)}</div>

            ${res.actual?`<div class="ract ${res.status==='fail'?'err':''}">${esc(res.actual)}</div>`:""}
            ${cur && r.waiting && r.waiting.type==="ask" ? `<div class="ask"><div class="hint" style="margin:0 0 4px">✋ ${esc(r.waiting.prompt)}</div>
                <div style="display:flex;gap:6px"><input id="rn-ans" class="input" value="${esc(r.waiting.suggest||"")}" placeholder="Type a value" onkeydown="if(event.key==='Enter')rnAnswer()"><button class="btn primary sm" onclick="rnAnswer()">Use</button></div></div>`:""}
            ${cur && r.waiting && r.waiting.type==="manual" ? `<div class="ask"><div class="hint" style="margin:0 0 4px">👤 Check this on the phone, then record the result.</div>
                <input id="rn-actual" class="input" placeholder="Actual result (optional)" style="margin-bottom:6px">
                <div style="display:flex;gap:6px"><button class="btn sm green" onclick="rnManual('pass')">✓ Pass</button><button class="btn sm danger" onclick="rnManual('fail')">✕ Fail</button><button class="btn sm" onclick="rnManual('blocked')">Blocked</button></div></div>`:""}
            ${cur && r.waiting && r.waiting.type==="failed" ? `<div class="ask"><div style="display:flex;gap:6px"><button class="btn sm" onclick="rnContinue()">Continue anyway</button><button class="btn sm" onclick="rnRetry()">Retry step</button></div></div>`:""}

          highlight: r.focus?[r.focus]:[]})}</div>
        <div class="hint" style="text-align:center">Starts with the test data, like a user's saved profile. You can type on the phone at any time.</div></div>
      <div class="rside">

        <select class="input" onchange="rnDataset(this.value)"><option value="">Apply a dataset…</option>${r.datasets.map((d,i)=>`<option value="${i}">${esc(d.name)}</option>`).join("")}</select>

      <span style="flex:1"></span>

const sleep = ms => new Promise(r=>setTimeout(r,ms));
function rnLog(t,k=""){ state.run.log.push({t,k}); }
function rnInput(el){ state.run.values[el.dataset.k]=el.value; }

function rnBackUser(){ state.run.screen="profile"; rnLog("tap Back to profile"); renderRunner(); }
function rnTap(){ const r=state.run, miss=missingOf(r.rules, r.values); r.toast = miss.length ? `Still missing: ${miss.map(label).join(", ")}` : "Saved — profile complete";
  if (!miss.length && afterSaveScreen(rnUI())) r.screen = afterSaveScreen(rnUI()); rnLog(`tap ${rnUI().button_label} → ${r.toast}`); }
function rnDataset(i){ if(i==="") return; const d=state.run.datasets[+i]; Object.assign(state.run.data, d.values); rnLog(`dataset “${d.name}” applied`); renderRunner(); }
async function rnSaveDataset(){ const name=prompt("Dataset name","My test data"); if(!name) return;
  const d = await api("/api/datasets",{method:"POST",body:{name, values:state.run.data}}); state.run.datasets.unshift(d); toast("Dataset saved"); renderRunner(); }
function rnResolve(v, field){
  const r=state.run; const m=/^\{\{\s*(ask:)?(.+?)\s*\}\}$/.exec(String(v??""));
  if (!m) return {value:String(v??"")};
  const key = `${r.idx}:${r.op}`;
  if (key in r.answers) return {value:r.answers[key]};
  if (m[1]) return {ask:m[2], suggest:r.data[field]||r.data[snakeOf(m[2])]||""};
  const f = m[2].trim(); if (r.data[f]!==undefined && r.data[f]!=="") return {value:r.data[f]};
  return {ask:`No test data for “${label(f)}”. Enter a value:`, suggest:""};
}
const snakeOf = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
function rnExec(o){
  const r=state.run, ui=rnUI(); r.focus = o.field || null;
  const fail = msg => ({ok:false, msg}), ok = msg => ({ok:true, msg});
  switch(o.op){
    case "set": { const v = rnResolve(o.value, o.field); if (v.ask!==undefined) return {wait:{type:"ask", prompt:v.ask, suggest:v.suggest, field:o.field}};
      r.values[o.field]=v.value; return ok(`set ${label(o.field)} = “${v.value}”`); }
    case "clear": r.values[o.field]=""; return ok(`clear ${label(o.field)}`);
    case "tap": rnTap(); return ok(`tapped ${ui.button_label}`);
    case "expect_banner": { const t=rnBannerText(), vis=!!t;
      if (vis!==!!o.visible) return fail(`expected banner ${o.visible?"visible":"hidden"} but it is ${vis?"visible: “"+t+"”":"hidden"}`);
      if (o.contains && !t.toLowerCase().includes(String(o.contains).toLowerCase())) return fail(`banner doesn't mention “${o.contains}”: “${t}”`);
      return ok(`banner ${vis?"visible":"hidden"}${o.contains?` and mentions “${o.contains}”`:""} ✓`); }
    case "expect_field_error": { const err = missingOf(r.rules, r.values).includes(o.field);
      return err===(o.error!==false) ? ok(`${label(o.field)} ${err?"highlighted":"not highlighted"} ✓`) : fail(`${label(o.field)} is ${err?"":"not "}highlighted`); }
    case "expect_field_visible": { const vis = profileFields(r.rules).includes(o.field);
      return vis===(o.visible!==false) ? ok(`${label(o.field)} ${vis?"shown":"not shown"} ✓`) : fail(`${label(o.field)} is ${vis?"shown":"not shown"}`); }
    case "expect_ui": { const actual = String(ui[o.key]??""); return actual.toLowerCase()===String(o.value).toLowerCase() ? ok(`${label(o.key)} is ${actual} ✓`) : fail(`${label(o.key)} is “${actual}”, expected “${o.value}”`); }
    case "expect_screen": { const cur = r.screen||"profile"; return cur===o.screen ? ok(`${label(cur)} screen showing ✓`) : fail(`expected the ${o.screen} screen but the ${cur} screen is showing`); }
    case "tap_back": r.screen="profile"; return ok("tapped Back to profile");
    case "expect_toast": return r.toast.toLowerCase().includes(String(o.contains||"").toLowerCase()) ? ok(`message “${r.toast}” ✓`) : fail(`message was “${r.toast||"(none)"}”, expected “${o.contains}”`);
  }
  return ok("skipped unknown op");
}
async function rnStepInner(){
  const r=state.run, s=r.case.steps[r.idx]; if (!s) return "end";
  const res=r.results[r.idx];
  if (!s.auto){ r.waiting={type:"manual"}; res.status="running"; return "wait"; }
  res.status="running";
  for (; r.op < s.auto.length; r.op++){
    const out = rnExec(s.auto[r.op]);
    if (out.wait){ r.waiting=out.wait; return "wait"; }
    rnLog((out.ok?"✓ ":"✕ ")+out.msg, out.ok?"":"err"); res.log.push(out.msg);
    renderRunner(); await sleep(260);
    if (!out.ok){ res.status="fail"; res.actual=out.msg; r.waiting={type:"failed"}; return "wait"; }
  }
  res.status="pass"; res.actual = res.log.filter(x=>x.includes("✓")).slice(-1)[0] || "done";
  r.idx++; r.op=0; return "next";
}
async function rnStep(){ const r=state.run; r.running=true; renderRunner(); await rnStepInner(); r.running=false; renderRunner(); }
async function rnRun(){ const r=state.run; r.running=true; renderRunner();
  while (true){ const o = await rnStepInner(); if (o!=="next") break; renderRunner(); await sleep(150); }
  r.running=false; renderRunner(); }
async function rnAnswer(){ const r=state.run, v=$("#rn-ans").value; if(!v.trim()) return toast("Enter a value");
  r.answers[`${r.idx}:${r.op}`]=v; if (r.waiting.field) r.data[r.waiting.field] = r.data[r.waiting.field] || v; rnLog(`tester entered “${v}”`); r.waiting=null; await rnRun(); }
async function rnManual(st){ const r=state.run, res=r.results[r.idx]; res.status=st; res.actual=($("#rn-actual").value||"").trim() || ({pass:"Verified by tester",fail:"Failed (tester)",blocked:"Blocked"})[st];
  rnLog(`👤 step ${r.idx+1}: ${st}`, st==="pass"?"":"err"); r.waiting=null; r.idx++; r.op=0; await rnRun(); }
async function rnContinue(){ const r=state.run; r.waiting=null; r.idx++; r.op=0; await rnRun(); }
function rnRetry(){ const r=state.run; r.waiting=null; r.results[r.idx]={status:"pending",actual:"",log:[]}; r.op=0; renderRunner(); }
function rnRestart(){ const r=state.run; openRunner(r.case.id, r.queue); }
async function rnFinish(overall){
  const r=state.run, notes=($("#rn-notes")||{}).value||"";
  const steps = r.case.steps.map((s,i)=>({n:i+1, status:r.results[i].status, actual:r.results[i].actual, log:r.results[i].log}));
  try {
    const out = await api(`/api/tests/${r.case.id}/runs`,{method:"POST",body:{cr_id:state.cr.id, status:overall, steps, data_used:r.data, notes, started_at:r.started}});
    toast(`${r.case.key} ${overall}${out.run.exported&&out.run.exported.zephyr?" · sent to Zephyr":""}`);
    const queue = r.queue; state.run = null; closeModal();
    state.cr = await api(`/api/cr/${state.cr.id}`); await loadTests(); await refreshList(); renderCR();
    if (queue.length) openRunner(queue[0], queue.slice(1));
    else if (state.tests.gate.all_passed) toast("🎉 All test cases passed — ready to merge");
  } catch(e){ toast(e.message); }
}
function rnClose(){ if (state.run && state.run.results.some(x=>x.status!=="pending") && !confirm("Discard this test run?")) return; state.run=null; closeModal(); }
function runAll(){ const ids = state.tests.cases.filter(c=>!(c.last_run&&c.last_run.status==="passed")).map(c=>c.id);
  const list = ids.length ? ids : state.tests.cases.map(c=>c.id); openRunner(list[0], list.slice(1)); }

function collectSettings(){

    if (!/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) || el.id.startsWith("s-llm")) return;
    const k = el.id.slice(2);
    if (el.dataset.onoff) body[k] = el.checked ? "on" : "off";
    else if (el.type === "password" || el.dataset.secret) { if (el.value.trim()) body[k] = el.value.trim(); }

  });
  return body;

const DEMO_STEPS = [
  ["traffic","Production traffic","A real user request hits the live backend"],
  ["crash","Crash","Unhandled exception → HTTP 500 for the user"],
  ["report","App reports the failure","The mobile app's API-failure reporter posts the 500 to MobileHeal"],
  ["detect","Incident detected","Grouped by fingerprint, input captured"],
  ["jira","Jira defect","Bug filed automatically and kept in sync"],
  ["diagnose","Diagnosis","Failing line, values and root cause"],
  ["reproduce","Reproduced","Replayed with the exact production input"],
  ["approve","Approval","A human approves the analysed fix before it runs"],
  ["fix","Fix found","Patch → replay loop until the crash is gone"],
  ["checks","Checks","Regression test + full suite on patched code"],
  ["pr","Pull request","hotfix/ branch from main, reviewed by 2 agents per platform"],
  ["review","Test","Test & approve the PR"],
  ["deploy","Merged & deployed","Committed and hot-reloaded into the running server"],
  ["verify","Verified","Same request now succeeds"],
];
const ANDROID_STEPS = ["traffic","crash","detect","jira","diagnose","approve","fix","checks","pr","review","deploy"];

   <div class="hdr"><div><h1>Production crash demo</h1><div class="meta">Trigger a real crash through the real code path and watch MobileHeal detect it, fix it and open a PR for review.</div></div>
     <div class="demo-ctl"><label class="ah"><span>Auto-play review & merge</span><span class="switch"><input type="checkbox" id="dm-auto" ${D.autoplay?"checked":""} onchange="state.demo.autoplay=this.checked"><span></span></span></label></div></div>
   ${h.autoheal?"":`<div class="banner-err" style="margin-top:14px">Auto-heal is off, so crashes will only be recorded. <button class="btn sm" onclick="toggleAutoheal(true).then(renderDemo)">Turn it on</button></div>`}
   <div class="scen">${d.scenarios.map(sc=>`<div class="card scard ${D.active&&D.active.id===sc.id?'on':''}"><div class="card-b">
      <div class="meta" style="margin-bottom:6px"><span class="chip ${sc.kind==='android'||sc.kind==='mobile_api'?'s-coding':'s-detected'}">${sc.kind==='android'?'Android app':sc.kind==='mobile_api'?'Android → API':sc.kind==='ios'?'iOS app':'Backend'}</span>
        ${sc.fixed?'<span class="chip s-pr_open">✓ bug fixed</span>':'<span class="chip s-failed">bug present</span>'}</div>

      <div class="hint" style="margin:0 0 10px"><b>Expect:</b> ${esc(sc.expect)}</div>
      <div class="hint" style="margin:0 0 10px"><code>${esc(sc.endpoint)}</code> · <code>${esc(sc.file.split("/").slice(-1)[0])}</code></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary sm" onclick="runDemo('${sc.id}')" ${D.running?"disabled":""}>▶ Run scenario</button>

        ${sc.incidents.length?`<a class="btn sm" href="#cr/${sc.incidents[0].id}">${esc(sc.incidents[0].key)} →</a>`:""}</div>

   <div id="dm-run">${demoRunHtml()}</div>`;
}
function demoRunHtml(){
  const D = state.demo, a = D.active; if (!a) return `<div class="empty">Pick a scenario to start. Tip: put this page and the Android emulator side by side.</div>`;
  const steps = DEMO_STEPS.filter(s => (a.kind==="mobile_api") || (s[0]!=="report" && ((a.kind!=="android" && a.kind!=="ios") || ANDROID_STEPS.includes(s[0]))));
  const t0 = a.t0, fmt = t => t==null ? "" : `+${((t-t0)/1000).toFixed(1)}s`;
  const m = a.marks;
  const metric = (lbl, from, to) => m[from]!=null && m[to]!=null ? `<div><b>${((m[to]-m[from])/1000).toFixed(1)}s</b><span>${lbl}</span></div>` : `<div><b>—</b><span>${lbl}</span></div>`;
  return `<div class="grid g-side" style="margin-top:16px">
    <div class="card"><div class="card-h"><span>${esc(a.title)}</span><span>${a.done?`<span class="chip ${a.outcome==='fixed'?'s-pr_open':'s-diagnosing'}">${esc(a.outcomeText)}</span>`:'<span class="chip s-coding"><span class="spinner"></span> running</span>'}</span></div>
      <div class="card-b"><ol class="dsteps">${steps.map(([k,t,sub])=>{ const st = a.status[k]||"pending";
        return `<li class="ds ${st}"><div class="dsn">${st==="done"?"✓":st==="fail"?"✕":st==="wait"?"⏸":st==="running"?"":"·"}</div>
          <div style="flex:1;min-width:0"><div class="dst"><b>${t}</b><span class="hint" style="margin:0">${fmt(m[k])}</span></div>
          <div class="hint" style="margin:1px 0 0">${esc(a.detail[k]||sub)}</div>
          ${k==="approve"&&st==="wait"?`<div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm primary" onclick="demoApproveFix()">✓ Approve auto-fix</button><a class="btn sm" href="#cr/${a.incId}/diagnosis">See analysis →</a></div>`:""}
          ${k==="review"&&st==="wait"?`<div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm green" onclick="demoApprove()">Approve & merge fix</button><a class="btn sm" href="#cr/${a.incId}/test">Review in detail →</a></div>`:""}
          ${a.extra[k]?`<pre class="out">${esc(a.extra[k])}</pre>`:""}</div></li>`; }).join("")}</ol></div></div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="card-h">Timings</div><div class="card-b"><div class="stat stat2">
        ${metric("crash → detected","crash","detect")}${metric("detected → fix PR","detect","pr")}${metric("crash → verified fix","crash","verify")}</div></div></div>
      ${a.incKey?`<div class="card"><div class="card-h">Incident</div><div class="card-b" style="display:grid;gap:8px">
        <div><a href="#cr/${a.incId}"><b>${esc(a.incKey)}</b></a> ${a.regression?`<span class="chip s-failed">regression of ${esc(a.regression)}</span>`:""}</div>
        ${a.prBranch?`<div><span class="branch">${esc(a.prBranch)}</span></div>`:""}
        <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn sm" href="#cr/${a.incId}/diagnosis">Diagnosis</a><a class="btn sm" href="#cr/${a.incId}/code">Diff</a><a class="btn sm" href="#cr/${a.incId}/checks">Checks</a></div></div></div>`:""}
      <div class="card"><div class="card-h">Live requests</div><div class="card-b"><div class="rlog" style="height:220px">${a.log.map(l=>`<div class="${l.k||""}">${esc(l.t)}</div>`).join("")}</div></div></div>
    </div></div>`;
}
function dmPaint(){ const el=document.getElementById("dm-run"); if (el && state.route==="demo") el.innerHTML = demoRunHtml(); }
function dmMark(k, st="done", detail=null, extra=null){ const a=state.demo.active; a.status[k]=st; if (st!=="running" && st!=="wait" && a.marks[k]==null) a.marks[k]=Date.now();
  if (st==="wait" && a.marks[k]==null) a.marks[k]=Date.now(); if (detail) a.detail[k]=detail; if (extra) a.extra[k]=extra; dmPaint(); }
function dmLog(t,k){ state.demo.active.log.push({t:`${new Date().toLocaleTimeString()}  ${t}`,k}); dmPaint(); }
async function resetDemo(id){ await act(async()=>{ const r = await api(`/api/demo/${id}/reset`,{method:"POST"}); await renderDemo(); }, "Bug re-introduced — ready to demo again"); }

async function demoApproveFix(auto=false){
  const a = state.demo.active; if (!a || !a.incId) return;
  try { await api(`/api/incidents/${a.incId}/approve`,{method:"POST",body:{note: auto?"auto-play":"approved from demo"}});
    dmMark("approve","done", auto?"Approved (auto-play)":"Approved by "+(state.settings.user_name||"you")); dmLog("✅ auto-fix approved"); }
  catch(e){ toast(e.message); }
}
async function runDemo(id){
  const D = state.demo, sc = D.data.scenarios.find(s=>s.id===id);
  if (sc.fixed){ if (!confirm("This bug is already fixed. Re-introduce it and run the scenario?")) return; await api(`/api/demo/${id}/reset`,{method:"POST"}); }
  D.running = true; D.autoplay = $("#dm-auto").checked;
  D.active = {id, title:sc.title, kind:sc.kind, t0:Date.now(), marks:{}, status:{}, detail:{}, extra:{}, log:[], done:false};
  await renderDemo();
  try {
    let incKey;
    dmMark("traffic","running");
    if (sc.kind === "ios") {
      dmLog("📱 iPhone 15 Pro · user taps Save on the Profile screen…");
      dmMark("traffic","done","User taps Save in the iOS app");
      dmLog("💥 Fatal error: Unexpectedly found nil while unwrapping an Optional value", "err");
      dmMark("crash","done","App crashed — CrashReporter uploads the Swift stack trace", D.data.ios_report.stack.split("\n").slice(0,3).join("\n"));
      const r = await api("/api/crashes",{method:"POST",body:D.data.ios_report}); incKey = r.incident;
      dmLog(`POST /api/crashes (platform: ios) → 201 ${incKey}`);
    } else if (sc.id === "android_startup") {
      dmLog("📱 Pixel 8 · user taps the MobileHeal icon…");
      dmMark("traffic","done","User launches the Android app");
      dmLog("💥 java.lang.ArithmeticException: divide by zero in MainActivity.onCreate", "err");
      dmMark("crash","done","App crashed on launch — CrashReporter uploads the report on next start", D.data.startup_report.stack.split("\n").slice(0,4).join("\n"));
      const r = await api("/api/crashes",{method:"POST",body:D.data.startup_report}); incKey = r.incident;
      dmLog(`POST /api/crashes → 201 ${incKey}`);
    } else if (sc.kind === "android") {
      dmLog("📱 Pixel 8 · user taps Save on the Profile screen…");
      dmMark("traffic","done","User taps Save in the Android app");
      dmLog("💥 java.lang.NullPointerException in ProfileViewModel.save", "err");
      dmMark("crash","done","App crashed — CrashReporter uploads the report on next launch", D.data.android_report.stack.split("\n").slice(0,3).join("\n"));
      const r = await api("/api/crashes",{method:"POST",body:D.data.android_report}); incKey = r.incident;
      dmLog(`POST /api/crashes → 201 ${incKey}`);
    } else if (sc.kind === "mobile_api") {
      const body = {name:"Sam Rivera", email:`sam-${Date.now()%100000}@example.com`};
      const prof = await api("/api/profiles",{method:"POST",body}); dmLog(`POST /api/profiles → 201 #${prof.id} (no city on file)`);
      const url = `/api/profiles/${prof.id}/contact`, hdr = {"X-MobileHeal-Client":"android"};
      dmLog("📱 Pixel 8 · user opens the Profile screen → the app loads the contact card…");
      dmMark("traffic","done", `Android app → GET ${url}`);
      const res = await fetch(url,{headers:hdr}); const j = await res.json();
      dmLog(`GET ${url} → ${res.status} ${JSON.stringify(j)}`, res.status>=500?"err":"");
      if (res.status < 500) { dmMark("crash","fail","No failure — the API is already fixed. Reset it and run again."); throw new Error("no crash"); }
      dmMark("crash","done",`HTTP ${res.status} returned to the app: ${j.detail}`);
      const rep = await api("/api/client-errors",{method:"POST",body:{platform:"android",method:"GET",endpoint:url,status:res.status,incident:j.incident,
                                                               body:JSON.stringify(j),device:"Google Pixel 8 (API 34)",app_version:"1.0",screen:"Profile"}});
      dmLog(`📲 ApiFailureInterceptor → POST /api/client-errors → ${rep.linked?"linked to "+rep.incident:"unmatched"}${rep.healing?" · heal started by the app":""}`);
      dmMark("report", rep.linked?"done":"fail", rep.linked?`Android app reported HTTP ${res.status} on GET ${url} → ${rep.incident}${rep.healing?" · heal started":""}`:rep.message);
      incKey = j.incident; D.active.url = url; D.active.hdr = hdr;
    } else {
      const body = id==="greeting" ? {email:`demo-${Date.now()%100000}@example.com`} : {name:"Partner Demo", email:`partner-${Date.now()%100000}@example.com`};
      const prof = await api("/api/profiles",{method:"POST",body}); dmLog(`POST /api/profiles → 201 #${prof.id} ${JSON.stringify(body)}`);
      const url = id==="greeting" ? `/api/profiles/${prof.id}/greeting` : `/api/profiles/${prof.id}/completion?fields=`;
      dmMark("traffic","done", `GET ${url}`);
      const res = await fetch(url); const j = await res.json();
      dmLog(`GET ${url} → ${res.status} ${JSON.stringify(j)}`, res.status>=500?"err":"");
      if (res.status < 500) { dmMark("crash","fail","No crash — the bug is already fixed. Reset it and run again."); throw new Error("no crash"); }
      dmMark("crash","done",`HTTP ${res.status}: ${j.detail}`);
      incKey = j.incident; D.active.url = url;
    }
    const inc0 = (await api("/api/cr")).find(c=>c.key===incKey);
    D.active.incKey = incKey; D.active.incId = inc0.id;
    let inc = await api(`/api/cr/${inc0.id}`);
    D.active.regression = inc.incident.regression_of;
    dmMark("detect","done", (inc.detected_by?`Detected by the ${inc.detected_by} · `:"") + `${incKey}: ${inc.incident.exc_type}${inc.incident.message?": "+inc.incident.message:""}` + (inc.occurrences>1?` (×${inc.occurrences})`:""));
    // follow the healer
    const seen = new Set();
    while (true) {
      inc = await api(`/api/cr/${inc0.id}`);
      for (const e of inc.coding_log||[]) {
        const key = e.ts+e.step+e.status+e.detail; if (seen.has(key)) continue; seen.add(key);
        const map = {"Diagnose":"diagnose","Reproduce":"reproduce","Fix":"fix","Run checks":"checks","Open pull request":"pr","Error":"fix"}; const k = map[e.step]; if (!k) continue;
        dmMark(k, e.status==="running"?"running":e.status==="fail"?"fail":"done", e.detail || null);
        if (e.detail) dmLog(`🤖 ${e.step}: ${e.detail}`, e.status==="fail"?"err":"");
      }
      if (inc.jira && inc.jira.key && D.active.status.jira!=="done") { dmMark("jira","done", `${inc.jira.key} · ${inc.jira.status||""}${inc.jira.mode==="mock"?" (mock Jira)":""}`); dmLog(`🐞 Jira defect ${inc.jira.key} created`); }
      if (inc.status==="awaiting_approval" && !D.active.approveAsked) {
        D.active.approveAsked = true;
        const pv = (inc.analysis||{}).preview;
        dmMark("approve","wait", `${(inc.analysis||{}).approach||"Proposed fix"} · ${(inc.analysis||{}).risk||"?"} risk`, pv?`- ${pv.before}\n+ ${pv.after}`:null);
        dmLog("⏸ waiting for approval to run the automatic fix");
        if (D.autoplay) { await sleep(1800); await demoApproveFix(true); }
      }
      if (inc.status==="fixing" && D.active.status.approve==="wait") dmMark("approve","done", "Approved by "+((inc.approval||{}).by||"you"));
      if (["pr_open","needs_engineer","merged","closed"].includes(inc.status)) break;
      await sleep(400);
    }
    if (inc.attempts) dmMark("fix","done", `${inc.attempts.filter(x=>x.patched).length} patch(es) · ${inc.attempts.map(x=>x.why).filter(Boolean).map(w=>w.split(". ")[0]).join(" → ")}`,
       inc.attempts.filter(x=>x.patched).map(x=>`- ${x.line}\n+ ${x.patched}`).join("\n"));
    if (inc.status === "needs_engineer") {
      if (sc.kind==="android"||sc.kind==="ios") dmMark("diagnose","done", inc.diagnosis ? inc.diagnosis.summary : "Stack trace recorded");
      dmMark("pr","fail","No verified automatic fix — routed to an engineer" + (state.settings.ai.available?"":" (parser mode — add a model API key so the agent's LLM can propose one)"));
      D.active.done = true; D.active.outcome = "engineer"; D.active.outcomeText = "Needs engineer"; D.running=false; await renderDemo(); return;
    }
    D.active.prBranch = inc.pr && inc.pr.branch;
    if (inc.checks) dmMark("checks","done", inc.checks.map(c=>`${c.status==="pass"?"✓":c.status==="fail"?"✕":"•"} ${c.name}`).join(" · "));
    dmMark("pr","done", `PR #${inc.pr.number} · ${inc.stats.files} files +${inc.stats.additions} −${inc.stats.deletions}`);
    // review
    if (D.autoplay) { dmMark("review","running","Auto-play: approving in 2s…"); await sleep(2000); await demoApprove(true); }
    else { dmMark("review","wait","Waiting for your approval — in Manual mode a person merges"); D.waitTimer = setInterval(demoWatchReview, 1500); }
  } catch(e) { if (e.message!=="no crash") toast(e.message); D.running=false; D.active.done = true; D.active.outcome="error"; D.active.outcomeText="Stopped"; await renderDemo(); }
}
async function demoWatchReview(){
  const D=state.demo, a=D.active; if(!a||a.done){ clearInterval(D.waitTimer); return; }
  const inc = await api(`/api/cr/${a.incId}`);
  if (inc.status==="merged"){ clearInterval(D.waitTimer); dmMark("review","done","Approved"); await demoAfterMerge(inc); }
}
async function demoApprove(auto=false){
  const D=state.demo, a=D.active; clearInterval(D.waitTimer);
  try {
    dmMark("review","running", auto?"Auto-play approving":"Approving…");
    await api(`/api/cr/${a.incId}/test`,{method:"POST",body:{passed:true, notes: auto?"Approved by demo auto-play":"Approved from the crash demo"}});
    dmMark("review","done", auto?"Approved (auto-play)":"Approved by "+(state.settings.user_name||"you")); dmLog("✅ fix approved");
    const inc = await api(`/api/cr/${a.incId}/merge`,{method:"POST"});
    await demoAfterMerge(inc);
  } catch(e){ toast(e.message); dmMark("review","wait"); }
}
async function demoAfterMerge(inc){
  const D=state.demo, a=D.active;
  dmMark("deploy","done", `Merged${inc.merged_commit?" as "+inc.merged_commit:""} · ${inc.deployed==="hot-reloaded"?"hot-reloaded, no restart":"restart the backend to load it"}`);
  dmLog(`⇡ merged ${inc.key}${inc.merged_commit?" "+inc.merged_commit:""}`);
  if (a.kind!=="android" && a.url) {
    const res = await fetch(a.url,{headers:a.hdr||{}}); const j = await res.json();
    dmLog(`GET ${a.url} → ${res.status} ${JSON.stringify(j)}`, res.status>=500?"err":"");
    dmMark("verify", res.status<500?"done":"fail", res.status<500?`HTTP ${res.status} — the same request now succeeds`:`Still HTTP ${res.status} — restart the backend`, JSON.stringify(j));
    a.outcome = res.status<500?"fixed":"error"; a.outcomeText = res.status<500?"Healed":"Restart needed";
  } else { a.outcome="fixed"; a.outcomeText="Fix merged — ship & verify on device"; dmLog("📦 next: build the app (./gradlew assembleDebug) and verify on a device"); }
  a.done = true; D.running=false; refreshList(); await renderDemo();
}

  const fixed = inc.filter(c=>c.status==="merged").length, incOpen = inc.filter(c=>!["merged","closed"].includes(c.status)).length;
  const sys = [
    ["Auto-heal agent", ag.state==="START", ag.state==="START" ? `running · every ${ag.interval_seconds}s` : "stopped", "#settings"],
