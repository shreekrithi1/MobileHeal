      <a class="kpi" href="#data"><div class="l">Data issues</div><div class="v" style="color:${d.high?"var(--red)":"inherit"}">${d.open||0}</div><div class="s">${d.high||0} blocking · ${d.resolved||0} resolved</div></a>

          <div>${att.length ? att.slice(0,8).map(x=>`<div class="att"><div class="ic ${x.c}" aria-hidden="true">${x.ic}</div><div class="tx"><b>${esc(x.t)}</b><span>${x.m}</span></div><a class="btn sm" href="${x.h}">${x.a}</a></div>`).join("")
            : `<div class="empty" style="padding:28px">✓ You're all caught up.</div>`}</div></section>
        <section class="card" aria-labelledby="h-flow"><div class="card-h"><span id="h-flow">Delivery pipeline</span><a class="hint" style="margin:0" href="#delivery">All requirements →</a></div>
          <div class="card-b"><div class="flow">${flow.map(([l,n])=>`<a href="#delivery"><b>${n}</b><span>${l}</span></a>`).join("")}</div>

async function renderApps(){
  const el = document.getElementById("apps-body"); if (!el) return;
  let d; try { d = await api("/api/clients"); } catch(e){ el.textContent = e.message; return; }
  const short = p => p ? p.replace(/^\/Users\/[^/]+\//, "~/") : "unknown folder";
  el.innerHTML = (d.demo_workspace ? `<div class="hint" style="margin:0 0 8px">🎬 This server runs the <b>demo copy</b> (${esc(short(d.server_workspace))}).</div>` : `<div class="hint" style="margin:0 0 8px">Server code: <code>${esc(short(d.server_workspace))}</code>${d.server_rules?` · rules ${esc(d.server_rules)}`:""}</div>`)
    + (d.clients.length ? d.clients.map(c => `<div style="padding:8px 0;border-top:1px solid var(--line);font-size:13px">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="dot8 ${c.connected?"ok":""}"></span><b>${c.platform==="ios"?"📱 iOS":"🤖 Android"}</b>
          <span>${esc(c.app)}</span>${c.demo_build?'<span class="chip s-design_review">Demo app</span>':""}<span class="hint" style="margin:0">${c.connected?"live":`seen ${ago(new Date(Date.now()-c.seconds_ago*1000).toISOString())}`}${c.rules?` · rules ${esc(c.rules)}`:""}</span></div>
        ${c.workspace?`<div class="hint" style="margin:2px 0 0">Built from <code>${esc(short(c.workspace))}</code></div>`:""}
        ${c.issues.map(i=>`<div class="hint err" style="margin:4px 0 0">⚠️ ${esc(i)}</div>`).join("")}</div>`).join("")
      : `<div class="hint" style="margin:0">No app has connected yet. Run the app in Android Studio (▶) or Xcode (⌘R).</div>`);
}

/* ---------- ⌘K command palette ---------- */
function paletteItems(){
  const nav = [["Home","#home","⌂"],["Requirements","#delivery","📝"],["Incidents","#incidents","🛡️"],["Test library","#tests","🧪"],["Data health","#data","🗄️"],["Crash demo","#demo","▶"],["Crashlytics","#crashes","🔥"],["App Studio","#studio","✦"],["Settings","#settings","⚙"],["Audit log","#audit","🕘"]]
    .map(([t,h,i])=>({g:"Go to",t,i,run:()=>go(h.slice(1))}));
  const acts = [
    {g:"Actions",t:"New change request",i:"＋",run:()=>go("new")},
    {g:"Actions",t:"Scan data now (DataWatchdog)",i:"🐶",run:async()=>{ go("data"); setTimeout(scanData, 300); }},
    {g:"Actions",t:"Simulate a production crash",i:"💥",run:()=>go("demo")},
    {g:"Actions",t:"Open live monitor",i:"📈",run:()=>{ location.href="/dashboard"; }},
    {g:"Actions",t:"Sync Android repository",i:"📦",run:()=>{ go("settings"); setTimeout(()=>window.syncRepo&&syncRepo(), 600); }},
  ];
  const items = (state.list||[]).map(c=>({g: c.kind==="incident"?"Incidents":"Requirements", t:`${c.key} · ${c.title}`, i: c.kind==="incident"?"⚠":"📄", s: STATUS[c.status]||c.status, run:()=>go("cr/"+c.id)}));
  return [...acts, ...nav, ...items];
}
function openPalette(){
  if ($("#pal")) return;
  const bg = document.createElement("div"); bg.className="pal-bg"; bg.id="pal";
  bg.innerHTML = `<div class="pal" role="dialog" aria-modal="true" aria-label="Command palette"><input id="pal-q" placeholder="Search requirements, incidents, pages and actions…" aria-label="Search" autocomplete="off"><ul id="pal-l" role="listbox"></ul></div>`;
  bg.addEventListener("click", e => { if (e.target === bg) closePalette(); });
  document.body.appendChild(bg); state.palIdx = 0; paintPalette(); $("#pal-q").focus();
  $("#pal-q").addEventListener("input", () => { state.palIdx = 0; paintPalette(); });
  $("#pal-q").addEventListener("keydown", e => {
    const n = state.palShown.length;
    if (e.key==="ArrowDown"){ e.preventDefault(); state.palIdx = (state.palIdx+1)%Math.max(n,1); paintPalette(); }
    else if (e.key==="ArrowUp"){ e.preventDefault(); state.palIdx = (state.palIdx-1+n)%Math.max(n,1); paintPalette(); }
    else if (e.key==="Enter"){ e.preventDefault(); const it = state.palShown[state.palIdx]; if (it){ closePalette(); it.run(); } }
    else if (e.key==="Escape"){ closePalette(); }
  });
}
function closePalette(){ const p = $("#pal"); if (p) p.remove(); }
function paintPalette(){
  const q = ($("#pal-q").value||"").toLowerCase().trim();
  const all = paletteItems().filter(x => !q || x.t.toLowerCase().includes(q) || x.g.toLowerCase().includes(q));
  state.palShown = all.slice(0, 40);
  let g = null;
  $("#pal-l").innerHTML = state.palShown.map((x,i)=>{ const head = x.g!==g ? `<div class="grp">${esc(x.g)}</div>` : ""; g = x.g;
    return head + `<li role="option" aria-selected="${i===state.palIdx}" class="${i===state.palIdx?"on":""}" onmousemove="if(state.palIdx!==${i}){state.palIdx=${i};paintPalette()}" onclick="state.palIdx=${i};const it=state.palShown[${i}];closePalette();it.run()"><span aria-hidden="true" style="width:20px;text-align:center">${x.i}</span>${esc(x.t)}${x.s?`<small>${esc(x.s)}</small>`:""}</li>`; }).join("")
    || `<div class="empty">No matches</div>`;
  const on = $("#pal-l li.on"); if (on) on.scrollIntoView({block:"nearest"});
}
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); $("#pal") ? closePalette() : openPalette(); }
  else if (e.key==="/" && !/input|textarea|select/i.test(document.activeElement.tagName) && !$("#pal")){ e.preventDefault(); openPalette(); }
});

window.__init();
</script>
