async function loadTests(){ try { state.tests = await api(`/api/cr/${state.cr.id}/tests`); } catch(e){ state.tests = null; } }
const SRC = {claude:["✦ Claude","s-coding"], generated:["Generated","s-closed"], zephyr:["Zephyr","s-design_review"], manual:["Manual","s-closed"], library:["Library","s-closed"]};
function srcChip(c){ const [t,k] = SRC[c.source]||[c.source||"—","s-closed"]; return `<span class="chip ${k}">${t}${c.source==="zephyr"&&c.external_key?" · "+esc(c.external_key):""}</span>`; }
function runChip(r){ if(!r) return `<span class="chip s-closed">Not run</span>`;
  return `<span class="chip ${r.status==='passed'?'s-pr_open':r.status==='failed'?'s-failed':'s-diagnosing'}">${r.status==='passed'?'✓ Passed':r.status==='failed'?'✕ Failed':'Blocked'}</span>`; }
function autoCount(c){ return c.steps.filter(s=>s.auto).length; }
function tTests(cr){
  if (!cr.pr) return `<div class="empty">Test cases are generated with the code once the design is approved.<br><br>
    <button class="btn" onclick="openImport(${cr.id})">Import from Zephyr now</button></div>`;
  const T = state.tests || {cases:[], gate:{total:0,passed:0,failed:0,not_run:0}}; const g = T.gate;
  const pct = g.total ? Math.round(100*g.passed/g.total) : 0;
  const added = cr.design.changes.filter(c=>c.kind==="field_added").map(c=>c.field);
  const p = state.preview, side = p.mode==="after" ? cr.design.after : cr.design.before;
  return `<div class="grid g-side">
   <div class="grid" style="align-content:start">
    <div class="card"><div class="card-b">
      <div class="row2"><div><div style="font-size:20px;font-weight:700;letter-spacing:-.02em">${g.passed}/${g.total} passed</div>
        <div class="hint" style="margin:2px 0 0">${g.failed?`<span class="err">${g.failed} failed</span> · `:""}${g.not_run} not run · ${g.required?"all must pass before merge":"tests are advisory (Settings → merge policy)"}</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${cr.status==="pr_open"?`<button class="btn primary" onclick="runAll()" ${T.cases.length?"":"disabled"}>▶ Run all</button>`:""}
          <button class="btn" onclick="openImport(${cr.id})">Import…</button>
          <button class="btn" onclick="openAttach()">From library</button>
          <button class="btn" onclick="openCaseEditor(null, ${cr.id})">+ Add case</button>
          <button class="btn" title="Regenerate generated cases" onclick="regenTests()">↻</button></div></div>
      <div class="progress"><i style="width:${pct}%"></i>${g.failed?`<i class="f" style="width:${Math.round(100*g.failed/g.total)}%"></i>`:""}</div>
    </div></div>
    ${T.cases.map(c=>`<div class="card case"><div class="card-b">
      <div class="row2"><div style="min-width:0"><div class="meta" style="gap:7px;margin-bottom:4px"><span>${esc(c.key)}</span>
          <span class="chip prio-${c.priority}">${esc(c.priority)}</span>${srcChip(c)}${runChip(c.last_run)}</div>
        <div style="font-weight:650">${esc(c.title)}</div>
        ${c.objective?`<div class="hint" style="margin:2px 0 0">${esc(c.objective)}</div>`:""}
        <div class="hint" style="margin:6px 0 0">${c.steps.length} steps · ${autoCount(c)} automated 🤖 · ${c.steps.length-autoCount(c)} manual 👤${Object.keys(c.test_data||{}).length?` · data: ${Object.keys(c.test_data).map(label).join(", ")}`:""}</div></div>
        <div style="display:flex;gap:6px;flex:none">${cr.status==="pr_open"?`<button class="btn sm primary" onclick="openRunner(${c.id})">▶ Run</button>`:""}
          <button class="btn sm" onclick="openCaseEditor(${c.id})">Edit</button>
          <button class="btn sm danger" title="Remove from this change" onclick="removeCase(${c.id})">✕</button></div></div>
      <details style="margin-top:8px"><summary class="hint" style="cursor:pointer;margin:0">Steps</summary><ol class="steps-ro">${c.steps.map(s=>`<li><span>${s.auto?"🤖":"👤"} ${esc(s.action)}</span>${s.expected?`<span class="hint" style="margin:0"> → ${esc(s.expected)}</span>`:""}</li>`).join("")}</ol></details>
    </div></div>`).join("") || `<div class="empty">No test cases yet.</div>`}
   </div>
   <div class="grid" style="align-content:start">
    <div class="card"><div class="card-h">Sign-off</div><div class="card-b">
      ${cr.override?`<div class="banner-err" style="margin:0 0 10px;background:var(--amber-soft);color:var(--amber)"><b>Override</b> by ${esc(cr.override.by)}: “${esc(cr.override.reason)}”</div>`:""}
      ${cr.status==="pr_open" ? (cr.tested ? `<div class="ok" style="font-weight:600">✓ Ready to merge</div><button class="btn green block" style="margin-top:10px" onclick="setTab('pr')">Review & merge →</button>`
        : `<div class="hint" style="margin:0 0 10px">${g.required?"Merging unlocks automatically when every test case passes.":"Tests are advisory; you can sign off manually."}</div>
           ${g.required?`<button class="btn block" onclick="openOverride()">Override with justification…</button>`:`<button class="btn primary block" onclick="markTested(true)">Mark as tested ✓</button>`}`) :
        `<div class="hint">${cr.status==="merged"?"Merged.":"—"}</div>`}
    </div></div>
    <div class="card"><div class="card-h"><span>Explore freely</span><div class="seg"><button class="${p.mode==='before'?'on':''}" onclick="pvMode('before')">Before</button><button class="${p.mode==='after'?'on':''}" onclick="pvMode('after')">After</button></div></div>
      <div class="card-b"><div class="phones">${phone({...side, values:p.values, interactive:true, highlight:p.mode==='after'?added:[], id:"pv", screen:p.screen||"profile"})}</div>
      <div class="hint" style="text-align:center">Type and tap — nothing is written to the live database.</div></div></div>
   </div></div>`;
}
async function regenTests(){ await act(async()=>{ state.tests = await api(`/api/cr/${state.cr.id}/tests/regenerate`,{method:"POST"}); renderCR(); }, "Test cases regenerated"); }
async function removeCase(id){ if(!confirm("Remove this test case from the change?")) return; await act(async()=>{ await api(`/api/tests/${id}`,{method:"DELETE"}); await loadTests(); renderCR(); }); }
function openOverride(){
  modal(`<div class="modal-h">Override the test gate</div><div class="modal-b">
    <p class="hint" style="margin-top:0">${state.tests.gate.passed}/${state.tests.gate.total} test cases passed. Overrides are recorded in the PR and the audit log.</p>
    <textarea id="ov-reason" class="input" rows="3" placeholder="Why is it safe to merge without all tests passing? (required)"></textarea></div>

}
async function doOverride(){ const r=$("#ov-reason").value.trim(); if (r.length<10) return toast("Write at least a sentence of justification"); closeModal(); await markTested(true, true, r); }

/* ---------- import (Zephyr API / file) ---------- */
function openImport(crId=null){
  const z = state.settings && state.settings.zephyr_configured;
  modal(`<div class="modal-h">Import test cases</div><div class="modal-b">
    <div class="seg" style="margin-bottom:14px"><button class="on" id="im-t1" onclick="imTab(1)">Zephyr Scale API</button><button id="im-t2" onclick="imTab(2)">CSV / JSON file</button></div>
    <div id="im-p1">${z?`<p class="hint" style="margin-top:0">Fetch test cases from Zephyr project <b>${esc(state.settings.zephyr_project_key)}</b>.</p>
        <div style="display:flex;gap:8px"><input id="im-folder" class="input" placeholder="Folder ID (optional)"><input id="im-max" class="input" type="number" value="50" style="width:100px"></div>`
      : `<p class="hint" style="margin-top:0">Zephyr isn't connected yet. <a href="#settings" onclick="closeModal()">Add your Zephyr API token and project key in Settings</a>, or import an exported file instead.</p>`}</div>
    <div id="im-p2" class="hide"><p class="hint" style="margin-top:0">Zephyr exports (CSV or JSON) with Name, Step, Test Data and Expected Result columns. One row per step.</p>
      <input type="file" id="im-file" accept=".csv,.json,text/csv,application/json" class="input">
      <textarea id="im-paste" class="input code" rows="5" style="min-height:0;margin-top:8px" placeholder="…or paste CSV/JSON here"></textarea></div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="im-auto" checked> ${state.settings&&state.settings.ai.available?"Use Claude to make steps runnable in the preview":"Auto-detect runnable steps"}</label>
    <div id="im-out"></div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" id="im-go" onclick="doImport(${crId===null?"null":crId})" ${z?"":""}>Import</button></div>`);
  state.imTab = 1;
}
function imTab(n){ state.imTab=n; $("#im-t1").classList.toggle("on",n===1); $("#im-t2").classList.toggle("on",n===2); $("#im-p1").classList.toggle("hide",n!==1); $("#im-p2").classList.toggle("hide",n!==2); }
async function doImport(crId){
  const b=$("#im-go"); b.disabled=true; b.innerHTML=`<span class="spinner"></span> Importing…`;
  try {
    let r;
    if (state.imTab===1) {
      if (!(state.settings&&state.settings.zephyr_configured)) throw new Error("Connect Zephyr in Settings, or use the file tab");
      r = await api("/api/tests/import/zephyr",{method:"POST",body:{cr_id:crId, folder_id:$("#im-folder").value||null, max_results:+$("#im-max").value||50, automate:$("#im-auto").checked}});
    } else {
      const f = $("#im-file").files[0]; let content = $("#im-paste").value, format;
      if (f) { content = await f.text(); format = f.name.toLowerCase().endsWith(".json") ? "json" : "csv"; }
      else format = content.trim().startsWith("{")||content.trim().startsWith("[") ? "json" : "csv";
      if (!content.trim()) throw new Error("Choose a file or paste its contents");
      r = await api("/api/tests/import",{method:"POST",body:{format, content, cr_id:crId, automate:$("#im-auto").checked}});
    }
    $("#im-out").innerHTML = `<div class="trbox ok" style="margin-top:12px">✓ Imported ${r.imported} case(s) · ${r.automated_steps}/${r.total_steps} steps runnable automatically</div>`;
    if (crId && state.cr) { await loadTests(); renderCR(); } else if (state.route==="tests") renderLibrary();
  } catch(e){ toast(e.message); }
  b.disabled=false; b.textContent="Import";
}
async function openAttach(){
  const lib = (await api("/api/tests")).filter(c => !c.cr_id);
  modal(`<div class="modal-h">Add from test library</div><div class="modal-b">${lib.length?lib.map(c=>`<label class="pickrow"><input type="checkbox" value="${c.id}">
      <span><b>${esc(c.key)}</b> ${esc(c.title)} ${srcChip(c)}</span></label>`).join(""):`<div class="hint">The library is empty. Import or create cases on the <a href="#tests" onclick="closeModal()">Test library</a> page.</div>`}</div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doAttach()" ${lib.length?"":"disabled"}>Add selected</button></div>`);
}
async function doAttach(){ const ids=[...document.querySelectorAll(".pickrow input:checked")].map(i=>+i.value); if(!ids.length) return toast("Pick at least one");
  await act(async()=>{ state.tests = await api(`/api/cr/${state.cr.id}/tests/attach`,{method:"POST",body:{case_ids:ids}}); closeModal(); renderCR(); }, `${ids.length} case(s) added`); }

/* ---------- case editor ---------- */
async function openCaseEditor(id, crId=null){
  const c = id ? await api(`/api/tests/${id}`) : {title:"", priority:"Medium", objective:"", preconditions:"", test_data:{}, steps:[{action:"",expected:"",auto:null}], cr_id:crId};
  state.edit = JSON.parse(JSON.stringify(c));
  renderEditor();
}
function renderEditor(){
  const c = state.edit;
  modal(`<div class="modal-h">${c.id?esc(c.key)+" · Edit test case":"New test case"} ${c.id?srcChip(c):""}</div><div class="modal-b">
    <div class="grid" style="grid-template-columns:1fr 140px;gap:10px"><input id="ce-title" class="input" placeholder="Title" value="${esc(c.title)}">
      <select id="ce-prio" class="input">${["High","Medium","Low"].map(p=>`<option ${c.priority===p?"selected":""}>${p}</option>`).join("")}</select></div>

    <div class="label" style="margin:14px 0 6px">Steps</div>
    <div id="ce-steps">${c.steps.map((s,i)=>`<div class="steprow"><span class="n">${i+1}</span>
      <input class="input" data-i="${i}" data-k="action" placeholder="Action (e.g. Leave Phone Number empty and tap Save)" value="${esc(s.action)}">
      <input class="input" data-i="${i}" data-k="expected" placeholder="Expected result" value="${esc(s.expected)}">
      <span title="${s.auto?esc(s.auto.map(o=>o.op).join(', ')):'manual'}">${s.auto?"🤖":"👤"}</span>
      <button class="btn sm" onclick="ceDel(${i})">✕</button></div>`).join("")}</div>
    <button class="btn sm" style="margin-top:6px" onclick="ceAdd()">+ Step</button>
    <div class="hint">🤖 = runs automatically in the preview · 👤 = you judge it. After saving, use “Make runnable” to let ${state.settings&&state.settings.ai.available?"Claude":"the parser"} automate edited steps.</div></div>
    <div class="modal-f">${c.id?`<button class="btn" onclick="ceAutomate()">✦ Make runnable</button>`:""}<span style="flex:1"></span>
      <button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="ceSave()">Save</button></div>`, "wide");
}
function ceCollect(){ const c=state.edit; c.title=$("#ce-title").value; c.priority=$("#ce-prio").value; c.objective=$("#ce-obj").value; c.preconditions=$("#ce-pre").value;
  c.test_data = Object.fromEntries($("#ce-data").value.split("\n").map(l=>l.split(/\s*[=:]\s*/)).filter(x=>x[0]&&x.length>1).map(([k,...v])=>[k.trim(),v.join("=").trim()]));
  document.querySelectorAll("#ce-steps input").forEach(inp=>{ const s=c.steps[+inp.dataset.i]; if (s[inp.dataset.k]!==inp.value){ s[inp.dataset.k]=inp.value; s.auto=null; } }); }
function ceAdd(){ ceCollect(); state.edit.steps.push({action:"",expected:"",auto:null}); renderEditor(); }
function ceDel(i){ ceCollect(); state.edit.steps.splice(i,1); renderEditor(); }
async function ceSave(){ ceCollect(); const c=state.edit; if(!c.title.trim()) return toast("Give the test a title");
  c.steps = c.steps.filter(s=>s.action.trim()||s.expected.trim());
  await act(async()=>{ if (c.id) await api(`/api/tests/${c.id}`,{method:"PUT",body:c});
    else if (c.cr_id) await api(`/api/cr/${c.cr_id}/tests`,{method:"POST",body:c}); else await api(`/api/tests`,{method:"POST",body:c});
    closeModal(); if (state.cr && state.route==="cr"){ await loadTests(); renderCR(); } else renderLibrary(); }, "Test case saved"); }
async function ceAutomate(){ ceCollect(); await api(`/api/tests/${state.edit.id}`,{method:"PUT",body:state.edit});
  await act(async()=>{ state.edit = await api(`/api/tests/${state.edit.id}/automate`,{method:"POST"}); renderEditor(); }, "Steps updated"); }

/* ---------- interactive runner ---------- */
function rnUI(){ return {...UI_DEF, ...(state.run.ui||{})}; }
function rnBannerText(){ const r=state.run, ui=rnUI(), miss=missingOf(r.rules, r.values);
  return miss.length ? (ui.banner_message || "Your profile is missing: " + miss.map(label).join(", ")) : ""; }
async function openRunner(caseId, queue=[]){
  const c = await api(`/api/tests/${caseId}`); const cr = state.cr;
  const datasets = await api("/api/datasets");
  const rules = cr.design.after.rules, ui = cr.design.after.ui;
  state.run = {case:c, queue, rules, ui, datasets, data:{...(c.test_data||{})}, values:{...(c.test_data||{})}, idx:0, op:0, answers:{},
    results:c.steps.map(()=>({status:"pending", actual:"", log:[]})), toast:"", waiting:null, running:false, started:new Date().toISOString(), log:[]};
  renderRunner();
}
function renderRunner(){
  const r = state.run, c = r.case;
  const done = r.results.filter(x=>["pass","fail","blocked"].includes(x.status)).length;
  const overall = r.results.some(x=>x.status==="fail") ? "failed" : r.results.some(x=>x.status==="blocked") ? "blocked" : done===c.steps.length ? "passed" : null;
  const fieldsInRules = profileFields(r.rules);
  modal(`<div class="modal-h"><span><span class="hint" style="margin:0">${esc(c.key)}</span> ${esc(c.title)} <span class="chip prio-${c.priority}">${esc(c.priority)}</span> ${srcChip(c)}</span>
      <span style="display:flex;gap:8px;align-items:center">${r.queue.length?`<span class="hint" style="margin:0">${r.queue.length} more queued</span>`:""}<button class="btn sm" onclick="rnClose()">Close</button></span></div>
    <div class="runner">
      <div class="rsteps">${c.preconditions?`<div class="hint" style="margin:0 0 8px"><b>Preconditions:</b> ${esc(c.preconditions)}</div>`:""}
        ${c.steps.map((s,i)=>{ const res=r.results[i], cur=i===r.idx&&!overall;
          return `<div class="rstep ${cur?'cur':''} st-${res.status}"><div class="rdot">${{pass:"✓",fail:"✕",blocked:"!",running:"",pending:i+1}[res.status]??i+1}</div>
          <div style="min-width:0;flex:1"><div class="ra">${s.auto?'<span title="automated">🤖</span>':'<span title="manual">👤</span>'} ${esc(s.action)}</div>
            ${s.expected?`<div class="re">Expected: ${esc(s.expected)}</div>`:""}
            ${res.actual?`<div class="ract ${res.status==='fail'?'err':''}">${esc(res.actual)}</div>`:""}
            ${cur && r.waiting && r.waiting.type==="ask" ? `<div class="ask"><div class="hint" style="margin:0 0 4px">✋ ${esc(r.waiting.prompt)}</div>
                <div style="display:flex;gap:6px"><input id="rn-ans" class="input" value="${esc(r.waiting.suggest||"")}" placeholder="Type a value" onkeydown="if(event.key==='Enter')rnAnswer()"><button class="btn primary sm" onclick="rnAnswer()">Use</button></div></div>`:""}
            ${cur && r.waiting && r.waiting.type==="manual" ? `<div class="ask"><div class="hint" style="margin:0 0 4px">👤 Check this on the phone, then record the result.</div>
                <input id="rn-actual" class="input" placeholder="Actual result (optional)" style="margin-bottom:6px">
                <div style="display:flex;gap:6px"><button class="btn sm green" onclick="rnManual('pass')">✓ Pass</button><button class="btn sm danger" onclick="rnManual('fail')">✕ Fail</button><button class="btn sm" onclick="rnManual('blocked')">Blocked</button></div></div>`:""}
            ${cur && r.waiting && r.waiting.type==="failed" ? `<div class="ask"><div style="display:flex;gap:6px"><button class="btn sm" onclick="rnContinue()">Continue anyway</button><button class="btn sm" onclick="rnRetry()">Retry step</button></div></div>`:""}
          </div></div>`; }).join("")}
      </div>
      <div class="rphone"><div class="phones">${phone({rules:r.rules, ui:r.ui, values:r.values, interactive:true, id:"rn", onInput:"rnInput", onTap:"rnTapUser", screen:r.screen||"profile", onBack:"rnBackUser",
          highlight: r.focus?[r.focus]:[]})}</div>
        <div class="hint" style="text-align:center">Starts with the test data, like a user's saved profile. You can type on the phone at any time.</div></div>
      <div class="rside">
        <div class="label">Test data</div>
        <select class="input" onchange="rnDataset(this.value)"><option value="">Apply a dataset…</option>${r.datasets.map((d,i)=>`<option value="${i}">${esc(d.name)}</option>`).join("")}</select>
        <div class="tdata">${[...new Set([...Object.keys(r.data), ...fieldsInRules])].map(k=>`<label><span>${esc(label(k))}</span><input class="input" value="${esc(r.data[k]??"")}" oninput="state.run.data['${k}']=this.value"></label>`).join("")}</div>
        <button class="btn sm" onclick="rnSaveDataset()">Save as dataset</button>
        <div class="label" style="margin-top:14px">Log</div><div class="rlog" id="rn-log">${r.log.slice(-40).map(l=>`<div class="${l.k}">${esc(l.t)}</div>`).join("")}</div>
      </div>
    </div>
    <div class="modal-f">${overall?`<span class="chip ${overall==='passed'?'s-pr_open':overall==='failed'?'s-failed':'s-diagnosing'}" style="font-size:13px;padding:3px 12px">Result: ${overall}</span>`:`<span class="hint" style="margin:0">${done}/${c.steps.length} steps done</span>`}
      <span style="flex:1"></span>
      <button class="btn" onclick="rnRestart()">Restart</button>
      ${overall ? `<input id="rn-notes" class="input" placeholder="Run notes (optional)" style="max-width:260px"><button class="btn primary" onclick="rnFinish('${overall}')">Save result${r.queue.length?" & next":""}</button>`
        : `<button class="btn" onclick="rnStep()" ${r.running||r.waiting?"disabled":""}>Step</button><button class="btn primary" onclick="rnRun()" ${r.running||r.waiting?"disabled":""}>▶ Run</button>`}
    </div>`, "xwide");
  const lg=document.getElementById("rn-log"); if(lg) lg.scrollTop=lg.scrollHeight;
  const a=document.getElementById("rn-ans"); if(a) a.focus();
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function rnLog(t,k=""){ state.run.log.push({t,k}); }
function rnInput(el){ state.run.values[el.dataset.k]=el.value; }
function rnTapUser(){ rnTap(); renderRunner(); }
function rnBackUser(){ state.run.screen="profile"; rnLog("tap Back to profile"); renderRunner(); }
function rnTap(){ const r=state.run, miss=missingOf(r.rules, r.values); r.toast = miss.length ? `Still missing: ${miss.map(label).join(", ")}` : "Saved — profile complete";
  if (!miss.length && rnUI().after_save==="success_screen") r.screen = "success"; rnLog(`tap ${rnUI().button_label} → ${r.toast}`); }
function rnDataset(i){ if(i==="") return; const d=state.run.datasets[+i]; Object.assign(state.run.data, d.values); rnLog(`dataset “${d.name}” applied`); renderRunner(); }
async function rnSaveDataset(){ const name=prompt("Dataset name","My test data"); if(!name) return;
  const d = await api("/api/datasets",{method:"POST",body:{name, values:state.run.data}}); state.run.datasets.unshift(d); toast("Dataset saved"); renderRunner(); }
function rnResolve(v, field){
  const r=state.run; const m=/^\{\{\s*(ask:)?(.+?)\s*\}\}$/.exec(String(v??""));
  if (!m) return {value:String(v??"")};
  const key = `${r.idx}:${r.op}`;
  if (key in r.answers) return {value:r.answers[key]};
  if (m[1]) return {ask:m[2], suggest:r.data[field]||r.data[snakeOf(m[2])]||""};
  const f = m[2].trim(); if (r.data[f]!==undefined && r.data[f]!=="") return {value:r.data[f]};
  return {ask:`No test data for “${label(f)}”. Enter a value:`, suggest:""};
}
const snakeOf = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
function rnExec(o){
  const r=state.run, ui=rnUI(); r.focus = o.field || null;
  const fail = msg => ({ok:false, msg}), ok = msg => ({ok:true, msg});
  switch(o.op){
    case "set": { const v = rnResolve(o.value, o.field); if (v.ask!==undefined) return {wait:{type:"ask", prompt:v.ask, suggest:v.suggest, field:o.field}};
      r.values[o.field]=v.value; return ok(`set ${label(o.field)} = “${v.value}”`); }
    case "clear": r.values[o.field]=""; return ok(`clear ${label(o.field)}`);
    case "tap": rnTap(); return ok(`tapped ${ui.button_label}`);
    case "expect_banner": { const t=rnBannerText(), vis=!!t;
      if (vis!==!!o.visible) return fail(`expected banner ${o.visible?"visible":"hidden"} but it is ${vis?"visible: “"+t+"”":"hidden"}`);
      if (o.contains && !t.toLowerCase().includes(String(o.contains).toLowerCase())) return fail(`banner doesn't mention “${o.contains}”: “${t}”`);
      return ok(`banner ${vis?"visible":"hidden"}${o.contains?` and mentions “${o.contains}”`:""} ✓`); }
    case "expect_field_error": { const err = missingOf(r.rules, r.values).includes(o.field);
      return err===(o.error!==false) ? ok(`${label(o.field)} ${err?"highlighted":"not highlighted"} ✓`) : fail(`${label(o.field)} is ${err?"":"not "}highlighted`); }
    case "expect_field_visible": { const vis = profileFields(r.rules).includes(o.field);
      return vis===(o.visible!==false) ? ok(`${label(o.field)} ${vis?"shown":"not shown"} ✓`) : fail(`${label(o.field)} is ${vis?"shown":"not shown"}`); }
    case "expect_ui": { const actual = String(ui[o.key]??""); return actual.toLowerCase()===String(o.value).toLowerCase() ? ok(`${label(o.key)} is ${actual} ✓`) : fail(`${label(o.key)} is “${actual}”, expected “${o.value}”`); }
    case "expect_screen": { const cur = r.screen||"profile"; return cur===o.screen ? ok(`${label(cur)} screen showing ✓`) : fail(`expected the ${o.screen} screen but the ${cur} screen is showing`); }
    case "tap_back": r.screen="profile"; return ok("tapped Back to profile");
    case "expect_toast": return r.toast.toLowerCase().includes(String(o.contains||"").toLowerCase()) ? ok(`message “${r.toast}” ✓`) : fail(`message was “${r.toast||"(none)"}”, expected “${o.contains}”`);
  }
  return ok("skipped unknown op");
}
async function rnStepInner(){
  const r=state.run, s=r.case.steps[r.idx]; if (!s) return "end";
  const res=r.results[r.idx];
  if (!s.auto){ r.waiting={type:"manual"}; res.status="running"; return "wait"; }
  res.status="running";
  for (; r.op < s.auto.length; r.op++){
    const out = rnExec(s.auto[r.op]);
    if (out.wait){ r.waiting=out.wait; return "wait"; }
    rnLog((out.ok?"✓ ":"✕ ")+out.msg, out.ok?"":"err"); res.log.push(out.msg);
    renderRunner(); await sleep(260);
    if (!out.ok){ res.status="fail"; res.actual=out.msg; r.waiting={type:"failed"}; return "wait"; }
  }
  res.status="pass"; res.actual = res.log.filter(x=>x.includes("✓")).slice(-1)[0] || "done";
  r.idx++; r.op=0; return "next";
}
async function rnStep(){ const r=state.run; r.running=true; renderRunner(); await rnStepInner(); r.running=false; renderRunner(); }
async function rnRun(){ const r=state.run; r.running=true; renderRunner();
  while (true){ const o = await rnStepInner(); if (o!=="next") break; renderRunner(); await sleep(150); }
  r.running=false; renderRunner(); }
async function rnAnswer(){ const r=state.run, v=$("#rn-ans").value; if(!v.trim()) return toast("Enter a value");
  r.answers[`${r.idx}:${r.op}`]=v; if (r.waiting.field) r.data[r.waiting.field] = r.data[r.waiting.field] || v; rnLog(`tester entered “${v}”`); r.waiting=null; await rnRun(); }
async function rnManual(st){ const r=state.run, res=r.results[r.idx]; res.status=st; res.actual=($("#rn-actual").value||"").trim() || ({pass:"Verified by tester",fail:"Failed (tester)",blocked:"Blocked"})[st];
  rnLog(`👤 step ${r.idx+1}: ${st}`, st==="pass"?"":"err"); r.waiting=null; r.idx++; r.op=0; await rnRun(); }
async function rnContinue(){ const r=state.run; r.waiting=null; r.idx++; r.op=0; await rnRun(); }
function rnRetry(){ const r=state.run; r.waiting=null; r.results[r.idx]={status:"pending",actual:"",log:[]}; r.op=0; renderRunner(); }
function rnRestart(){ const r=state.run; openRunner(r.case.id, r.queue); }
async function rnFinish(overall){
  const r=state.run, notes=($("#rn-notes")||{}).value||"";
  const steps = r.case.steps.map((s,i)=>({n:i+1, status:r.results[i].status, actual:r.results[i].actual, log:r.results[i].log}));
  try {
    const out = await api(`/api/tests/${r.case.id}/runs`,{method:"POST",body:{cr_id:state.cr.id, status:overall, steps, data_used:r.data, notes, started_at:r.started}});
    toast(`${r.case.key} ${overall}${out.run.exported&&out.run.exported.zephyr?" · sent to Zephyr":""}`);
    const queue = r.queue; state.run = null; closeModal();
    state.cr = await api(`/api/cr/${state.cr.id}`); await loadTests(); await refreshList(); renderCR();
    if (queue.length) openRunner(queue[0], queue.slice(1));
    else if (state.tests.gate.all_passed) toast("🎉 All test cases passed — ready to merge");
  } catch(e){ toast(e.message); }
}
function rnClose(){ if (state.run && state.run.results.some(x=>x.status!=="pending") && !confirm("Discard this test run?")) return; state.run=null; closeModal(); }

  const D = state.demo, sc = D.data.scenarios.find(s=>s.id===id);
  if (sc.fixed){ if (!confirm("This bug is already fixed. Re-introduce it and run the scenario?")) return; await api(`/api/demo/${id}/reset`,{method:"POST"}); }
  D.running = true; D.autoplay = $("#dm-auto").checked;
  D.active = {id, title:sc.title, kind:sc.kind, t0:Date.now(), marks:{}, status:{}, detail:{}, extra:{}, log:[], done:false};
  await renderDemo();
  try {
    let incKey;
    dmMark("traffic","running");
    if (sc.kind === "android") {
      dmLog("📱 Pixel 8 · user taps Save on the Profile screen…");
      dmMark("traffic","done","User taps Save in the Android app");
      dmLog("💥 java.lang.NullPointerException in ProfileViewModel.save", "err");
      dmMark("crash","done","App crashed — CrashReporter uploads the report on next launch", D.data.android_report.stack.split("\n").slice(0,3).join("\n"));
      const r = await api("/api/crashes",{method:"POST",body:D.data.android_report}); incKey = r.incident;
      dmLog(`POST /api/crashes → 201 ${incKey}`);
    } else {
      const body = id==="greeting" ? {email:`demo-${Date.now()%100000}@example.com`} : {name:"Partner Demo", email:`partner-${Date.now()%100000}@example.com`};
      const prof = await api("/api/profiles",{method:"POST",body}); dmLog(`POST /api/profiles → 201 #${prof.id} ${JSON.stringify(body)}`);
      const url = id==="greeting" ? `/api/profiles/${prof.id}/greeting` : `/api/profiles/${prof.id}/completion?fields=`;
      dmMark("traffic","done", `GET ${url}`);
      const res = await fetch(url); const j = await res.json();
      dmLog(`GET ${url} → ${res.status} ${JSON.stringify(j)}`, res.status>=500?"err":"");
      if (res.status < 500) { dmMark("crash","fail","No crash — the bug is already fixed. Reset it and run again."); throw new Error("no crash"); }
      dmMark("crash","done",`HTTP ${res.status}: ${j.detail}`);
      incKey = j.incident; D.active.url = url;
    }
    const inc0 = (await api("/api/cr")).find(c=>c.key===incKey);
    D.active.incKey = incKey; D.active.incId = inc0.id;
    let inc = await api(`/api/cr/${inc0.id}`);
    D.active.regression = inc.incident.regression_of;
    dmMark("detect","done", `${incKey}: ${inc.incident.exc_type}${inc.incident.message?": "+inc.incident.message:""}` + (inc.occurrences>1?` (×${inc.occurrences})`:""));
    // follow the healer
    const seen = new Set();
    while (true) {
      inc = await api(`/api/cr/${inc0.id}`);
      for (const e of inc.coding_log||[]) {
        const key = e.ts+e.step+e.status+e.detail; if (seen.has(key)) continue; seen.add(key);
        const map = {"Diagnose":"diagnose","Reproduce":"reproduce","Fix":"fix","Run checks":"checks","Open pull request":"pr","Error":"fix"}; const k = map[e.step]; if (!k) continue;
        dmMark(k, e.status==="running"?"running":e.status==="fail"?"fail":"done", e.detail || null);
        if (e.detail) dmLog(`🤖 ${e.step}: ${e.detail}`, e.status==="fail"?"err":"");
      }
      if (["pr_open","needs_engineer","merged","closed"].includes(inc.status)) break;
      await sleep(400);
    }
    if (inc.attempts) dmMark("fix","done", `${inc.attempts.filter(x=>x.patched).length} patch(es) · ${inc.attempts.map(x=>x.why).filter(Boolean).map(w=>w.split(". ")[0]).join(" → ")}`,
       inc.attempts.filter(x=>x.patched).map(x=>`- ${x.line}\n+ ${x.patched}`).join("\n"));
    if (inc.status === "needs_engineer") {
      if (sc.kind==="android") dmMark("diagnose","done", inc.diagnosis ? inc.diagnosis.summary : "Stack trace recorded");
      dmMark("pr","fail","No verified automatic fix — routed to an engineer" + (state.settings.ai.available?"":" (add an Anthropic key so Claude can propose one)"));
      D.active.done = true; D.active.outcome = "engineer"; D.active.outcomeText = "Needs engineer"; D.running=false; await renderDemo(); return;
    }
    D.active.prBranch = inc.pr && inc.pr.branch;
    if (inc.checks) dmMark("checks","done", inc.checks.map(c=>`${c.status==="pass"?"✓":c.status==="fail"?"✕":"•"} ${c.name}`).join(" · "));
    dmMark("pr","done", `PR #${inc.pr.number} · ${inc.stats.files} files +${inc.stats.additions} −${inc.stats.deletions}`);
    // review
    if (D.autoplay) { dmMark("review","running","Auto-play: approving in 2s…"); await sleep(2000); await demoApprove(true); }
    else { dmMark("review","wait","Waiting for your approval — the agent never merges on its own"); D.waitTimer = setInterval(demoWatchReview, 1500); }
  } catch(e) { if (e.message!=="no crash") toast(e.message); D.running=false; D.active.done = true; D.active.outcome="error"; D.active.outcomeText="Stopped"; await renderDemo(); }
}
async function demoWatchReview(){
  const D=state.demo, a=D.active; if(!a||a.done){ clearInterval(D.waitTimer); return; }
  const inc = await api(`/api/cr/${a.incId}`);
  if (inc.status==="merged"){ clearInterval(D.waitTimer); dmMark("review","done","Approved"); await demoAfterMerge(inc); }
}
async function demoApprove(auto=false){
  const D=state.demo, a=D.active; clearInterval(D.waitTimer);
  try {
    dmMark("review","running", auto?"Auto-play approving":"Approving…");
    await api(`/api/cr/${a.incId}/test`,{method:"POST",body:{passed:true, notes: auto?"Approved by demo auto-play":"Approved from the crash demo"}});
    dmMark("review","done", auto?"Approved (auto-play)":"Approved by "+(state.settings.user_name||"you")); dmLog("✅ fix approved");
    const inc = await api(`/api/cr/${a.incId}/merge`,{method:"POST"});
    await demoAfterMerge(inc);
  } catch(e){ toast(e.message); dmMark("review","wait"); }
}
async function demoAfterMerge(inc){
  const D=state.demo, a=D.active;
  dmMark("deploy","done", `Merged${inc.merged_commit?" as "+inc.merged_commit:""} · ${inc.deployed==="hot-reloaded"?"hot-reloaded, no restart":"restart the backend to load it"}`);
  dmLog(`⇡ merged ${inc.key}${inc.merged_commit?" "+inc.merged_commit:""}`);
  if (a.kind!=="android" && a.url) {
    const res = await fetch(a.url); const j = await res.json();
    dmLog(`GET ${a.url} → ${res.status} ${JSON.stringify(j)}`, res.status>=500?"err":"");
    dmMark("verify", res.status<500?"done":"fail", res.status<500?`HTTP ${res.status} — the same request now succeeds`:`Still HTTP ${res.status} — restart the backend`, JSON.stringify(j));
    a.outcome = res.status<500?"fixed":"error"; a.outcomeText = res.status<500?"Healed":"Restart needed";
  } else { a.outcome="fixed"; a.outcomeText="Fix merged — ship & verify on device"; dmLog("📦 next: build the app (./gradlew assembleDebug) and verify on a device"); }
  a.done = true; D.running=false; refreshList(); await renderDemo();
}

window.__init();
</script>
